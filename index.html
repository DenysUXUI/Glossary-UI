  <label class="lab">Cena netto</label>
  <div class="affix"><input class="in" value="12,40"><span>PLN</span></div>
  <label class="lab" style="margin-top:9px">Rezystancja</label>
  <div class="affix"><input class="in" value="4,7"><span>kΩ</span></div>
 </div>`},

{c:"B",n:"08",en:"Character counter",alt:"input counter",pl:"licznik znaków",
 ua:"Показує ліміт. Має сенс лише коли ліміт справді жорсткий; рахунок вниз («залишилось 40») читається швидше за 60/100.",
 o:{pl:"Pokazuje limit. Ma sens tylko wtedy, gdy limit jest naprawdę twardy; odliczanie w dół («zostało 40») czyta się szybciej niż 60/100.",
    en:"Shows the limit. Only worth it when the limit is genuinely hard; counting down ('40 left') reads faster than 60/100."},
 ex:{ua:"Лічильник має рахувати вниз — «zostało 40» читається швидше за 60/100.",
     pl:"Licznik ma odliczać w dół — «zostało 40» czyta się szybciej niż 60/100.",
     en:"Make the counter count down — '40 left' reads faster than 60/100."},
 d:`<div class="col">
  <label class="lab">Nazwa projektu</label>
  <input class="in" value="Sterownik LED — rewizja B">
  <div class="counter"><span>Widoczne na liście</span><span>27/60</span></div>
 </div>`},

{c:"B",n:"09",en:"Search field",alt:"search bar, search input",pl:"pole wyszukiwania",
 ua:"Вхідна точка пошуку. Обов'язкові дрібниці: іконка лупи, кнопка очистки, збереження запиту після переходу на результати.",
 o:{pl:"Punkt wejścia do wyszukiwania. Obowiązkowe drobiazgi: ikona lupy, przycisk czyszczenia, zachowanie zapytania po przejściu na wyniki.",
    en:"The entry point to search. The mandatory details: a magnifier icon, a clear button, and keeping the query after moving to the results."},
 ex:{ua:"Запит губиться на сторінці результатів — треба лишати його в полі.",
     pl:"Zapytanie ginie na stronie wyników — trzeba je zostawiać w polu.",
     en:"The query is lost on the results page — it has to stay in the field."},
 d:`<div class="col">
  <div class="affix"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.4"/><path d="m20 20-4.4-4.4"/></svg></span><input class="in" value="rezystor 4.7k 0805"><span style="cursor:pointer">✕︎</span></div>
 </div>`},

{c:"B",n:"10",en:"Password field",alt:"masked input",pl:"pole hasła",
 ua:"Замаскований ввід з перемикачем «показати». Приховування без можливості перевірити — головна причина помилок при вході.",
 o:{pl:"Zamaskowany wpis z przełącznikiem «pokaż». Ukrywanie bez możliwości sprawdzenia to główna przyczyna błędów przy logowaniu.",
    en:"Masked input with a show/hide toggle. Hiding it with no way to check is the main source of sign-in errors."},
 ex:{ua:"Додай перемикач «показати» — без нього люди помиляються на вході.",
     pl:"Dodaj przełącznik «pokaż» — bez niego ludzie mylą się przy logowaniu.",
     en:"Add a show-password toggle — without it people fail the sign-in."},
 d:`<div class="col">
  <label class="lab">Hasło</label>
  <div class="affix"><input class="in" type="password" value="tajnehaslo"><span style="cursor:pointer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.7 5.8 12 5.8 22.2 12 22.2 12 18.3 18.2 12 18.2 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="2.9"/></svg></span></div>
 </div>`},

{c:"B",n:"11",en:"OTP input",alt:"PIN input, verification code",pl:"pole kodu jednorazowego",
 ua:"Розбитий на клітинки код з SMS/пошти. Має підтримувати вставку всього коду одразу — інакше користувач вставляє 6 цифр у першу клітинку.",
 o:{pl:"Kod z SMS-a lub maila rozbity na osobne pola. Musi obsługiwać wklejenie całego kodu naraz — inaczej użytkownik wkleja 6 cyfr do pierwszej kratki.",
    en:"A code from SMS or email split into separate boxes. It must accept the whole code pasted at once — otherwise the user drops all six digits into the first box."},
 ex:{ua:"OTP не приймає вставку всього коду — люди клеять 6 цифр у першу клітинку.",
     pl:"Pole kodu nie przyjmuje wklejenia całości — ludzie wklejają 6 cyfr do pierwszej kratki.",
     en:"The OTP field won't take a full paste — people dump all six digits in the first box."},
 d:`<div class="col" style="align-items:center">
  <div class="otp"><i>4</i><i>0</i><i>7</i><i class="act">|</i><i></i><i></i></div>
  <div class="hint" style="text-align:center">Kod wysłany na +48 ••• ••• 421</div>
 </div>`},

{c:"B",n:"12",en:"File upload",alt:"dropzone, file picker",pl:"przesyłanie plików",
 ua:"Кнопка + зона перетягування. Завжди вказуй дозволені формати й максимальний розмір ДО спроби завантаження.",
 o:{pl:"Przycisk plus strefa przeciągania. Zawsze podawaj dozwolone formaty i maksymalny rozmiar PRZED próbą wysłania.",
    en:"A button plus a drop zone. Always state the allowed formats and maximum size BEFORE the upload is attempted."},
 ex:{ua:"Напиши формати й ліміт до завантаження, а не в помилці після нього.",
     pl:"Napisz formaty i limit przed wysyłką, a nie w błędzie po niej.",
     en:"State the formats and the size limit up front, not in an error afterwards."},
 d:`<div class="drop">
  <div style="font-size:19px;margin-bottom:5px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5v-12M7.2 12.8 12 8l4.8 4.8M4 3.5h16"/></svg></div>
  <b>Przeciągnij plik BOM</b>
  <small>.csv, .xlsx — do 10 MB</small>
 </div>`},

{c:"B",n:"13",en:"Form",alt:"data entry form",pl:"formularz",
 ua:"Набір полів з однією метою. Одна колонка, логічні групи, дія-підтвердження внизу зліва або справа — консистентно в межах продукту.",
 o:{pl:"Zestaw pól z jednym celem. Jedna kolumna, logiczne grupy, akcja potwierdzająca na dole po lewej albo po prawej — konsekwentnie w całym produkcie.",
    en:"A set of fields with one goal. One column, logical groups, the confirming action at the bottom left or right — consistently across the product."},
 ex:{ua:"Форму в одну колонку — дві колонки збивають порядок читання.",
     pl:"Formularz w jednej kolumnie — dwie kolumny psują kolejność czytania.",
     en:"Make the form single-column — two columns break the reading order."},
 d:`<div class="col">
  <div><label class="lab">Firma</label><input class="in" value="Elektro-Serwis Sp. z o.o."></div>
  <div><label class="lab">NIP</label><input class="in" value="725 000 12 34"></div>
  <button class="b b-p" style="justify-content:center;margin-top:2px">Zapisz dane</button>
 </div>`},

{c:"B",n:"14",en:"Fieldset",alt:"field group",pl:"grupa pól",
 ua:"Смислова група полів зі спільним заголовком. Для screen reader — <fieldset> + <legend>, інакше зв'язок між групою та полями втрачається.",
 o:{pl:"Znaczeniowa grupa pól ze wspólnym nagłówkiem. Dla czytnika ekranu — <fieldset> plus <legend>, inaczej związek między grupą a polami przepada.",
    en:"A meaningful group of fields under a shared heading. For screen readers it's <fieldset> plus <legend>, otherwise the link between the group and the fields is lost."},
 ex:{ua:"Загорни адресу доставки у fieldset — інакше скрінрідер не бачить групи.",
     pl:"Zawiń adres dostawy w fieldset — inaczej czytnik ekranu nie widzi grupy.",
     en:"Wrap the delivery address in a fieldset — otherwise the screen reader can't see the group."},
 d:`<div class="col">
  <div class="cap" style="margin-bottom:2px">Adres dostawy</div>
  <input class="in" value="ul. Ustronna 41" style="margin-bottom:7px">
  <div style="display:flex;gap:7px"><input class="in" value="93-350" style="width:78px"><input class="in" value="Łódź"></div>
 </div>`},

/* ============ C · ВИБІР ============ */
{c:"C",n:"01",en:"Checkbox",alt:"tick box",pl:"pole wyboru",
 ua:"Множинний вибір або згода. Кожен чекбокс незалежний. Клік по підпису має перемикати стан — це найчастіший недогляд у верстці.",
 o:{pl:"Wybór wielokrotny albo zgoda. Każde pole wyboru jest niezależne. Kliknięcie w etykietę musi przełączać stan — to najczęstsze niedopatrzenie we wdrożeniu.",
    en:"Multiple choice or consent. Each checkbox is independent. Clicking the label must toggle it — the most commonly missed detail in implementation."},
 ex:{ua:"Клік по підпису не перемикає чекбокс — це треба полагодити.",
     pl:"Kliknięcie w etykietę nie przełącza checkboxa — to trzeba naprawić.",
     en:"Clicking the label doesn't toggle the checkbox — that needs fixing."},
 note:"У розмові поляки кажуть <b>checkbox</b>; «pole wyboru» — мова документації й локалізації.",
 nt:{pl:"W rozmowie mówi się <b>checkbox</b>; «pole wyboru» to język dokumentacji i lokalizacji.",
     en:"In speech Poles say <b>checkbox</b>; «pole wyboru» belongs to documentation and localisation."},
 d:`<div class="col">
  <label class="chk"><input type="checkbox" checked> Produkty dostępne od ręki</label>
  <label class="chk"><input type="checkbox"> Tylko RoHS</label>
  <label class="chk"><input type="checkbox"> Pokaż zamienniki</label>
 </div>`},

{c:"C",n:"02",en:"Indeterminate checkbox",alt:"partial, mixed state",pl:"stan nieokreślony",
 ua:"Третій стан для батьківського чекбокса, коли частина дочірніх вибрана. Візуально — риска, не галочка.",
 o:{pl:"Trzeci stan rodzicielskiego pola wyboru, gdy zaznaczona jest część dzieci. Wizualnie kreska, nie ptaszek.",
    en:"The third state of a parent checkbox when only some children are selected. Shown as a dash, not a tick."},
 ex:{ua:"Батьківський чекбокс має бути в неозначеному стані — вибрано не всі рядки.",
     pl:"Rodzicielski checkbox ma być w stanie nieokreślonym — zaznaczone są nie wszystkie wiersze.",
     en:"The parent checkbox should be indeterminate — not every row is selected."},
 d:`<div class="col">
  <label class="chk"><input type="checkbox" id="ind"> <b>Wszystkie kategorie</b></label>
  <label class="chk" style="margin-left:20px"><input type="checkbox" checked> Rezystory</label>
  <label class="chk" style="margin-left:20px"><input type="checkbox"> Kondensatory</label>
 </div>`},

{c:"C",n:"03",en:"Radio group",alt:"radio button, option button",pl:"przyciski opcji",
 ua:"Рівно один варіант із кількох. Показуй усі опції одразу (2–6). Не можна зняти вибір — тому має бути безпечне значення за замовчуванням.",
 o:{pl:"Dokładnie jedna opcja z kilku. Pokazuj wszystkie naraz (2–6). Wyboru nie da się cofnąć, więc musi być bezpieczna wartość domyślna.",
    en:"Exactly one option out of several. Show them all at once (2–6). The choice can't be undone, so there has to be a safe default."},
 ex:{ua:"Тут потрібні radio, а не чекбокси — варіанти взаємовиключні.",
     pl:"Tu trzeba przycisków opcji, nie checkboxów — warianty się wykluczają.",
     en:"These should be radios, not checkboxes — the options are mutually exclusive."},
 note:"Формально <b>przycisk opcji</b>, у мовленні — <b>radio button</b> / <b>radio</b>.",
 nt:{pl:"Formalnie <b>przycisk opcji</b>, w mowie — <b>radio button</b> / <b>radio</b>.",
     en:"Formally <b>przycisk opcji</b> in Polish; in speech it's <b>radio button</b> or just <b>radio</b>."},
 d:`<div class="col">
  <div class="cap" style="margin-bottom:3px">Sposób dostawy</div>
  <label class="chk"><input type="radio" name="dv" checked> Kurier DPD — 18,00 zł</label>
  <label class="chk"><input type="radio" name="dv"> Paczkomat — 12,99 zł</label>
  <label class="chk"><input type="radio" name="dv"> Odbiór osobisty — 0 zł</label>
 </div>`},

{c:"C",n:"04",en:"Switch",alt:"toggle",pl:"przełącznik",
 ua:"Вмикає/вимикає налаштування з негайним ефектом — без кнопки «зберегти». Якщо потрібне підтвердження, це чекбокс, а не switch.",
 o:{pl:"Włącza i wyłącza ustawienie ze skutkiem natychmiastowym — bez przycisku «zapisz». Jeśli potrzebne jest potwierdzenie, to jest checkbox, a nie przełącznik.",
    en:"Turns a setting on and off with immediate effect — no save button. If it needs confirmation, it's a checkbox, not a switch."},
 ex:{ua:"Switch працює одразу — якщо тут треба «zapisz», став чекбокс.",
     pl:"Przełącznik działa natychmiast — jeśli tu trzeba «zapisz», daj checkbox.",
     en:"A switch applies immediately — if this needs a save button, use a checkbox."},
 d:`<div class="col">
  <label class="sw"><input type="checkbox" checked><i></i> Ceny netto</label>
  <label class="sw"><input type="checkbox"><i></i> Pokaż tylko magazyn PL</label>
 </div>`},

{c:"C",n:"05",en:"Select",alt:"dropdown, select box",pl:"lista rozwijana",
 ua:"Вибір одного зі списку, коли варіантів багато (7+). Приховує опції — для 2–4 варіантів radio або segmented читаються швидше.",
 o:{pl:"Wybór jednej pozycji z listy, gdy opcji jest dużo (7+). Ukrywa opcje — przy 2–4 wariantach przyciski opcji albo kontrolka segmentowa czytają się szybciej.",
    en:"Picking one item from a list when there are many options (7+). It hides the options — with 2–4 choices, radios or a segmented control read faster."},
 ex:{ua:"Тут лише три опції — постав radio, а не list rozwijaną.",
     pl:"Tu są tylko trzy opcje — daj przyciski opcji, a nie listę rozwijaną.",
     en:"There are only three options here — use radios, not a dropdown."},
 d:`<div class="col">
  <label class="lab">Obudowa</label>
  <select class="sel"><option>SMD 0805</option><option>SMD 0603</option><option>THT axial</option></select>
 </div>`},

{c:"C",n:"06",en:"Combobox",alt:"select with search",pl:"pole kombi",
 ua:"Поле вводу + випадний список: можна друкувати або вибрати. Стандартне рішення для довгих довідників — країни, виробники, категорії.",
 o:{pl:"Pole wpisu plus lista rozwijana: można pisać albo wybrać. Standardowe rozwiązanie dla długich słowników — kraje, producenci, kategorie.",
    en:"A text field plus a dropdown: type or pick. The standard answer for long reference lists — countries, manufacturers, categories."},
 ex:{ua:"Виробників 400 — тут потрібен combobox з пошуком, а не select.",
     pl:"Producentów jest 400 — tu trzeba pola kombi z wyszukiwaniem, a nie zwykłej listy.",
     en:"There are 400 manufacturers — this needs a searchable combobox, not a plain select."},
 d:`<div class="col">
  <label class="lab">Producent</label>
  <input class="in" value="Tex" style="border-color:var(--pcb)">
  <div class="menu" style="width:100%;margin-top:3px">
    <a><span>Texas Instruments</span></a><a><span>Texim Europe</span></a><a><span>Textool</span></a>
  </div>
 </div>`},

{c:"C",n:"07",en:"Multiselect",alt:"multi-select, tag select",pl:"lista wielokrotnego wyboru",
 ua:"Кілька значень в одному полі, вибране показується чипами. Слідкуй за висотою поля — при 10 вибраних воно не має ламати форму.",
 o:{pl:"Kilka wartości w jednym polu, wybrane pokazują się jako chipy. Pilnuj wysokości pola — przy 10 zaznaczonych nie może rozwalić formularza.",
    en:"Several values in one field, shown as chips. Watch the field height — ten selections must not blow up the form."},
 ex:{ua:"Перевір, що буде при 10 вибраних — поле не має рвати форму.",
     pl:"Sprawdź, co będzie przy 10 zaznaczonych — pole nie może rozwalić formularza.",
     en:"Check what happens with ten selected — the field mustn't break the form."},
 d:`<div class="col">
  <label class="lab">Certyfikaty</label>
  <div class="in" style="display:flex;gap:5px;flex-wrap:wrap;padding:6px">
    <span class="chip on" style="font-size:11px;padding:2px 7px">RoHS <i class="x">✕︎</i></span>
    <span class="chip on" style="font-size:11px;padding:2px 7px">REACH <i class="x">✕︎</i></span>
    <span style="color:var(--muted);font-size:12px;padding:2px">dodaj…</span>
  </div>
 </div>`},

{c:"C",n:"08",en:"Autocomplete",alt:"typeahead, suggestions",pl:"autouzupełnianie",
 ua:"Підказки під час вводу. Виділяй збіг, показуй категорію результату і не змінюй перший результат при кожному натисканні клавіші.",
 o:{pl:"Podpowiedzi w trakcie pisania. Wyróżniaj dopasowanie, pokazuj kategorię wyniku i nie zmieniaj pierwszego wyniku przy każdym naciśnięciu klawisza.",
    en:"Suggestions as you type. Highlight the match, show the result's category, and don't reshuffle the first result on every keystroke."},
 ex:{ua:"Перший результат стрибає на кожному символі — зафіксуй його.",
     pl:"Pierwszy wynik skacze przy każdym znaku — ustabilizuj go.",
     en:"The top result jumps on every keystroke — stabilise it."},
 d:`<div class="col">
  <div class="affix"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.4"/><path d="m20 20-4.4-4.4"/></svg></span><input class="in" value="rezys"></div>
  <div class="menu" style="width:100%;margin-top:3px">
    <a><span><b>rezys</b>tor SMD</span><kbd>1 240</kbd></a>
    <a><span><b>rezys</b>tor drutowy</span><kbd>318</kbd></a>
    <a><span><b>rezys</b>tor precyzyjny</span><kbd>96</kbd></a>
  </div>
 </div>`},

{c:"C",n:"09",en:"Slider",alt:"range input",pl:"suwak",
 ua:"Приблизне значення в діапазоні. Погано працює для точних чисел — завжди дублюй числовим полем.",
 o:{pl:"Przybliżona wartość z zakresu. Źle działa przy dokładnych liczbach — zawsze dubluj polem liczbowym.",
    en:"An approximate value within a range. Poor for exact numbers — always pair it with a numeric field."},
 ex:{ua:"Продублюй слайдер числовим полем — точне значення ним не спіймати.",
     pl:"Zdubluj suwak polem liczbowym — dokładnej wartości nim nie trafisz.",
     en:"Back the slider with a numeric field — you can't hit an exact value with it."},
 d:`<div class="col">
  <div style="display:flex;justify-content:space-between"><span class="cap">Jasność</span><span class="cap">68%</span></div>
  <input type="range" value="68">
 </div>`},

{c:"C",n:"10",en:"Range slider",alt:"multi-thumb slider",pl:"suwak zakresu",
 ua:"Два маркери — «від» і «до». Класика фільтрів ціни. Обов'язково додай поля вводу: ручками важко влучити в точне значення.",
 o:{pl:"Dwa znaczniki — «od» i «do». Klasyka filtrów ceny. Koniecznie dodaj pola wpisu: uchwytami trudno trafić w dokładną wartość.",
    en:"Two handles — 'from' and 'to'. The classic price filter. Always add input fields: handles can't hit an exact value."},
 ex:{ua:"До range slider додай поля «від» і «до» — інакше ціну не виставиш.",
     pl:"Do suwaka zakresu dodaj pola «od» i «do» — inaczej ceny nie ustawisz.",
     en:"Add 'from' and 'to' inputs to the range slider — otherwise you can't set the price."},
 d:`<div class="col" style="align-items:center">
  <div class="dual"><div class="trk"></div><div class="fil"></div><b style="left:26%"></b><b style="right:22%"></b></div>
  <div style="display:flex;gap:7px;width:100%"><input class="in" value="2,50"><input class="in" value="18,00"></div>
 </div>`},

{c:"C",n:"11",en:"Stepper",alt:"number input, spinbutton",pl:"pole liczbowe z krokiem",
 ua:"Число + кнопки «−/+». Для e-commerce критично: поле має лишатись редагованим з клавіатури — інакше 250 шт. набирати неможливо.",
 o:{pl:"Liczba plus przyciski «−/+». W e-commerce krytyczne: pole musi zostać edytowalne z klawiatury — inaczej nie da się wpisać 250 szt.",
    en:"A number plus minus and plus buttons. Critical in e-commerce: the field must stay keyboard-editable — otherwise you can't enter 250 pcs."},
 ex:{ua:"Хай кількість можна вписати з клавіатури — 250 шт. плюсиком не наклацаєш.",
     pl:"Niech ilość da się wpisać z klawiatury — 250 szt. plusem się nie naklika.",
     en:"Let people type the quantity — nobody clicks plus 250 times."},
 note:"У специфікації ARIA це <b>spinbutton</b>. У Material — <b>stepper</b>. Не плутати з «stepper» як індикатором кроків (D·11).",
 nt:{pl:"W specyfikacji ARIA to <b>spinbutton</b>. W Material — <b>stepper</b>. Nie mylić ze stepperem jako wskaźnikiem kroków (D·11).",
     en:"In the ARIA spec this is a <b>spinbutton</b>. Material calls it a <b>stepper</b>. Not the same as the step indicator in D·11."},
 d:`<div class="row">
  <div class="stp"><button>−</button><input value="250"><button>+</button></div>
  <span class="cap">szt. / opak. 100</span>
 </div>`},

{c:"C",n:"12",en:"Date picker",alt:"calendar picker",pl:"selektor daty",
 ua:"Календар для вибору дати. Завжди залишай ручний ввід: набрати «12.09.2026» швидше, ніж клікати 14 місяців назад.",
 o:{pl:"Kalendarz do wyboru daty. Zawsze zostawiaj ręczny wpis: wpisać «12.09.2026» jest szybciej niż klikać 14 miesięcy wstecz.",
    en:"A calendar for picking a date. Always keep manual entry: typing '12.09.2026' is faster than clicking back 14 months."},
 ex:{ua:"Лиши ручний ввід дати — клацати 14 місяців назад ніхто не буде.",
     pl:"Zostaw ręczny wpis daty — nikt nie będzie klikał 14 miesięcy wstecz.",
     en:"Keep manual date entry — nobody's clicking back 14 months."},
 d:`<div class="cal">
  <div class="cal-h"><span>‹</span> wrzesień 2026 <span>›</span></div>
  <div class="cal-g">
   <div class="dow">Pn</div><div class="dow">Wt</div><div class="dow">Śr</div><div class="dow">Cz</div><div class="dow">Pt</div><div class="dow">So</div><div class="dow">Nd</div>
   <div class="mut">31</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
   <div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div class="sel">12</div><div>13</div>
   <div>14</div><div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div>20</div>
  </div>
 </div>`},

{c:"C",n:"13",en:"Date range picker",alt:"period selector",pl:"selektor zakresu dat",
 ua:"Вибір періоду «від–до». Додавай пресети (ostatnie 7 dni, ten miesiąc) — 80% користувачів беруть саме їх.",
 o:{pl:"Wybór okresu «od–do». Dodawaj gotowe zakresy (ostatnie 7 dni, ten miesiąc) — 80% użytkowników bierze właśnie je.",
    en:"Picking an 'from–to' period. Add presets (last 7 days, this month) — 80% of users take those."},
 ex:{ua:"Додай пресети «ostatnie 7 dni» і «ten miesiąc» — їх беруть найчастіше.",
     pl:"Dodaj gotowce «ostatnie 7 dni» i «ten miesiąc» — z nich korzysta się najczęściej.",
     en:"Add 'last 7 days' and 'this month' presets — that's what people pick."},
 d:`<div class="cal">
  <div class="cal-h"><span>‹</span> wrzesień 2026 <span>›</span></div>
  <div class="cal-g">
   <div class="dow">Pn</div><div class="dow">Wt</div><div class="dow">Śr</div><div class="dow">Cz</div><div class="dow">Pt</div><div class="dow">So</div><div class="dow">Nd</div>
   <div>7</div><div class="sel">8</div><div class="rng">9</div><div class="rng">10</div><div class="rng">11</div><div class="sel">12</div><div>13</div>
  </div>
  <div class="hint" style="text-align:center">8–12 września · 5 dni</div>
 </div>`},

{c:"C",n:"14",en:"Color picker",alt:"color well",pl:"próbnik koloru",
 ua:"Вибір кольору. У продуктових інтерфейсах майже завжди достатньо готової палітри, а не повного спектра.",
 o:{pl:"Wybór koloru. W interfejsach produktowych prawie zawsze wystarcza gotowa paleta zamiast pełnego spektrum.",
    en:"A colour chooser. In product interfaces a fixed palette is almost always enough — you rarely need the full spectrum."},
 ex:{ua:"Дай палітру з токенів, а не повний спектр — інакше буде 40 відтінків зеленого.",
     pl:"Daj paletę z tokenów, a nie pełne spektrum — inaczej będzie 40 odcieni zieleni.",
     en:"Offer the token palette rather than the full spectrum — otherwise you get 40 shades of green."},
 d:`<div class="swatch">
  <b style="background:#0B5C43"></b><b style="background:#8A6516"></b><b style="background:#A32B1C"></b><b style="background:#14181A"></b>
  <input class="in" value="#0B5C43" style="width:88px;font-family:var(--mono);font-size:11px">
 </div>`},

{c:"C",n:"15",en:"Rating",alt:"star rating",pl:"ocena",
 ua:"Оцінка або відображення середньої. Для вводу — інтерактивна, для показу — статична з числом і кількістю відгуків поруч.",
 o:{pl:"Ocena albo prezentacja średniej. Do wystawiania — interaktywna, do pokazania — statyczna z liczbą i liczbą opinii obok.",
    en:"Rating input or an average display. Interactive when the user rates, static with the score and review count when you're just showing it."},
 ex:{ua:"Поряд із зірками покажи число і кількість відгуків — самі зірки нічого не кажуть.",
     pl:"Obok gwiazdek pokaż liczbę i liczbę opinii — same gwiazdki nic nie mówią.",
     en:"Show the score and the review count next to the stars — stars alone say nothing."},
 d:`<div class="row">
  <div class="stars">★︎★︎★︎★︎<span class="off">★︎</span></div>
  <span class="cap">4,2 · 118 opinii</span>
 </div>`},

/* ============ D · НАВІГАЦІЯ ============ */
{c:"D",n:"01",en:"Header",alt:"top bar, app bar, navbar",pl:"nagłówek",
 ua:"Верхня смуга: логотип, пошук, акаунт, кошик. Найдорожча нерухомість екрана — сюди йде лише те, що потрібне на будь-якій сторінці.",
 o:{pl:"Górny pasek: logo, wyszukiwarka, konto, koszyk. Najdroższa nieruchomość na ekranie — trafia tu tylko to, co jest potrzebne na każdej stronie.",
    en:"The top bar: logo, search, account, cart. The most expensive real estate on the screen — only what's needed on every page belongs here."},
 ex:{ua:"У шапці забагато всього — лиши те, що треба на кожній сторінці.",
     pl:"W nagłówku jest za dużo — zostaw to, co potrzebne na każdej stronie.",
     en:"There's too much in the header — keep only what's needed on every page."},
 d:`<div class="scene"><div style="display:flex;align-items:center;gap:7px;padding:8px 9px;border-bottom:1px solid var(--line)">
   <b style="font:600 11px var(--mono);color:var(--pcb)">LOGO</b>
   <div style="flex:1;height:19px;border:1px solid var(--line);border-radius:2px;background:var(--well)"></div>
   <span style="font-size:12px">☰</span><span style="font-size:12px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2.6l2.7 12.3a1.4 1.4 0 0 0 1.4 1.1h8.6a1.4 1.4 0 0 0 1.4-1.1L21 7.2H6"/></svg></span>
  </div>
  <div class="pg"><div class="bar m"></div><div class="bar"></div><div class="bar s"></div></div>
 </div>`},

{c:"D",n:"02",en:"Footer",alt:"page footer",pl:"stopka",
 ua:"Низ сторінки: правова інформація, контакти, карта сайту. Для B2B — місце для NIP, умов оплати й сертифікатів.",
 o:{pl:"Dół strony: informacje prawne, kontakt, mapa serwisu. W B2B to miejsce na NIP, warunki płatności i certyfikaty.",
    en:"The bottom of the page: legal information, contacts, sitemap. In B2B it's where the tax ID, payment terms and certificates go."},
 ex:{ua:"Винеси NIP і умови оплати в стопку — у B2B це шукають саме там.",
     pl:"Wynieś NIP i warunki płatności do stopki — w B2B szuka się tego właśnie tam.",
     en:"Move the tax ID and payment terms to the footer — in B2B that's where people look."},
 d:`<div class="scene"><div class="pg"><div class="bar m"></div><div class="bar s"></div></div>
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:9px;font-size:9px;font-family:var(--mono);line-height:1.7">
   O firmie · Kontakt · Regulamin<br>Polityka prywatności · NIP 727-012-46-05
  </div>
 </div>`},

{c:"D",n:"03",en:"Sidebar",alt:"side navigation, drawer nav",pl:"panel boczny",
 ua:"Вертикальна навігація зліва. Для глибоких каталогів краще за горизонтальне меню: витримує 3 рівні вкладеності без мега-меню.",
 o:{pl:"Nawigacja pionowa po lewej. Do głębokich katalogów lepsza niż menu poziome: wytrzymuje 3 poziomy zagnieżdżenia bez mega menu.",
    en:"Vertical navigation on the left. Better than a horizontal menu for deep catalogues: it handles three levels of nesting without a mega menu."},
 ex:{ua:"Для трьох рівнів каталогу бери сайдбар, горизонтальне меню не витягне.",
     pl:"Przy trzech poziomach katalogu weź panel boczny, poziome menu tego nie udźwignie.",
     en:"With three catalogue levels use a sidebar, a horizontal menu won't cope."},
 d:`<div class="scene"><div style="display:flex;height:100%">
  <div style="width:40%;background:var(--well);border-right:1px solid var(--line);padding:8px;font-size:9.5px;line-height:2">
   <div style="color:var(--pcb);font-weight:600">Rezystory</div>
   <div style="color:var(--muted)">Kondensatory</div>
   <div style="color:var(--muted)">Złącza</div>
   <div style="color:var(--muted)">Narzędzia</div>
  </div>
  <div class="pg" style="flex:1"><div class="bar m"></div><div class="bar"></div><div class="bar s"></div></div>
 </div></div>`},

{c:"D",n:"04",en:"Navigation rail",alt:"icon rail",pl:"wąski pasek nawigacji",
 ua:"Вузька смуга з іконками + підписами. Компроміс між сайдбаром і бургером на планшетах та широких десктопах.",
 o:{pl:"Wąski pasek z ikonami i podpisami. Kompromis między panelem bocznym a hamburgerem na tabletach i szerokich desktopach.",
    en:"A narrow strip of icons with labels. The compromise between a sidebar and a hamburger on tablets and wide desktops."},
 ex:{ua:"На планшеті постав nav rail — сайдбар з'їдає пів екрана.",
     pl:"Na tablecie daj wąski pasek nawigacji — panel boczny zjada pół ekranu.",
     en:"Use a navigation rail on tablet — the sidebar eats half the screen."},
 d:`<div class="rail">
  <div class="on"><b>▤︎</b>Katalog</div><div><b><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2S3.9 15 3.9 9.4A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.1 2.8c0 5.6-8.1 10.8-8.1 10.8Z"/></svg></b>Schowek</div><div><b><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2.6l2.7 12.3a1.4 1.4 0 0 0 1.4 1.1h8.6a1.4 1.4 0 0 0 1.4-1.1L21 7.2H6"/></svg></b>Koszyk</div><div><b>☰</b>Konto</div>
 </div>`},

{c:"D",n:"05",en:"Tabs",alt:"tab bar, tabbed panels",pl:"zakładki",
 ua:"Перемикання між рівнозначними панелями в межах одного контексту. URL має змінюватись — інакше вкладку не поділишся посиланням.",
 o:{pl:"Przełączanie między równorzędnymi panelami w jednym kontekście. URL musi się zmieniać — inaczej nie da się wysłać linku do zakładki.",
    en:"Switching between equally ranked panels within one context. The URL has to change — otherwise you can't share a link to a tab."},
 ex:{ua:"Вкладка не міняє URL — посиланням на неї не поділишся.",
     pl:"Zakładka nie zmienia adresu — nie da się jej wysłać linkiem.",
     en:"The tab doesn't change the URL — you can't share a link to it."},
 note:"Польською <b>zakładki</b>. Слово <b>karty</b> теж трапляється, але воно ж означає «cards» — уточнюй контекст.",
 nt:{pl:"Po polsku <b>zakładki</b>. Słowo <b>karty</b> też się pojawia, ale oznacza również «cards» — doprecyzuj kontekst.",
     en:"Polish uses <b>zakładki</b>. You'll also hear <b>karty</b>, but that also means cards — check the context."},
 d:`<div class="tabs">
  <input type="radio" name="tb" id="t1" checked><input type="radio" name="tb" id="t2"><input type="radio" name="tb" id="t3">
  <div class="tl"><label for="t1">Opis</label><label for="t2">Parametry</label><label for="t3">Do pobrania</label></div>
  <div class="tp p1">Rezystor grubowarstwowy SMD, tolerancja ±1%.</div>
  <div class="tp p2">4,7 kΩ · 0805 · 125 mW · ±100 ppm/K</div>
  <div class="tp p3">Karta katalogowa (PDF) · Model 3D STEP</div>
 </div>`},

{c:"D",n:"06",en:"Breadcrumb",alt:"breadcrumb trail",pl:"okruszki",
 ua:"Шлях по ієрархії. Критично для каталогів з глибокою вкладеністю — показує, де ти, і дає вихід на рівень вище одним кліком.",
 o:{pl:"Ścieżka po hierarchii. Krytyczna w katalogach o głębokim zagnieżdżeniu — pokazuje, gdzie jesteś, i daje wyjście poziom wyżej jednym kliknięciem.",
    en:"The trail through the hierarchy. Critical in deeply nested catalogues — it shows where you are and gets you one level up in a single click."},
 ex:{ua:"Додай okruszki — з четвертого рівня каталогу нема як вийти вгору.",
     pl:"Dodaj okruszki — z czwartego poziomu katalogu nie da się wyjść wyżej.",
     en:"Add breadcrumbs — there's no way up from the fourth catalogue level."},
 note:"Повна форма — <b>nawigacja okruszkowa</b>. У командах кажуть <b>okruszki</b> або просто <b>breadcrumbs</b>.",
 nt:{pl:"Pełna forma to <b>nawigacja okruszkowa</b>. W zespołach mówi się <b>okruszki</b> albo po prostu <b>breadcrumbs</b>.",
     en:"The full Polish term is <b>nawigacja okruszkowa</b>. Teams say <b>okruszki</b> or just <b>breadcrumbs</b>."},
 d:`<div class="crumb"><a>Katalog</a> › <a>Rezystory</a> › <a>SMD</a> › <b>0805</b></div>`},

{c:"D",n:"07",en:"Pagination",alt:"pager",pl:"paginacja",
 ua:"Розбиття довгого списку на сторінки. Для B2B-каталогів краще за нескінченний скрол: можна повернутись на сторінку 7 і зберегти позицію.",
 o:{pl:"Podział długiej listy na strony. W katalogach B2B lepsza niż nieskończone przewijanie: można wrócić na stronę 7 i zachować pozycję.",
    en:"Splitting a long list into pages. Better than infinite scroll for B2B catalogues: you can go back to page 7 and keep your place."},
 ex:{ua:"Тут краще пагінація, а не нескінченний скрол — люди вертаються на сторінку 7.",
     pl:"Tu lepsza będzie paginacja, a nie nieskończone przewijanie — ludzie wracają na stronę 7.",
     en:"Pagination beats infinite scroll here — people come back to page 7."},
 note:"Синонім — <b>stronicowanie</b>. Обидва вживані.",
 nt:{pl:"Synonim — <b>stronicowanie</b>. Oba są w użyciu.",
     en:"A synonym in Polish is <b>stronicowanie</b>. Both are in use."},
 d:`<div class="pag"><a>‹</a><a>1</a><a class="on">2</a><a>3</a><a>4</a><span>…</span><a>28</a><a>›</a></div>`},

{c:"D",n:"08",en:"Dropdown menu",alt:"menu, action menu",pl:"menu rozwijane",
 ua:"Список дій, що відкривається з кнопки. Групуй за смислом, розділяй сепаратором, деструктивну дію — вниз і червоним.",
 o:{pl:"Lista akcji otwierana z przycisku. Grupuj według sensu, rozdzielaj separatorem, akcję niszczącą daj na dół i na czerwono.",
    en:"A list of actions opened from a button. Group by meaning, separate with a divider, put the destructive action last and in red."},
 ex:{ua:"«Usuń» перенеси вниз меню і відділи сепаратором.",
     pl:"«Usuń» przenieś na dół menu i oddziel separatorem.",
     en:"Move 'Delete' to the bottom of the menu and separate it with a divider."},
 d:`<div class="menu">
  <a><span>Edytuj</span><kbd>⌘︎E</kbd></a>
  <a><span>Duplikuj</span><kbd>⌘︎D</kbd></a>
  <a><span>Eksportuj CSV</span></a>
  <hr><a class="dg"><span>Usuń</span><kbd>⌫︎</kbd></a>
 </div>`},

{c:"D",n:"09",en:"Context menu",alt:"right-click menu",pl:"menu kontekstowe",
 ua:"Меню по правому кліку, прив'язане до конкретного об'єкта. Ніколи не єдиний спосіб дістатись дії — на тач-пристроях його немає.",
 o:{pl:"Menu spod prawego przycisku myszy, przypięte do konkretnego obiektu. Nigdy nie może być jedyną drogą do akcji — na urządzeniach dotykowych go nie ma.",
    en:"A right-click menu tied to a specific object. It must never be the only route to an action — touch devices don't have it."},
 ex:{ua:"Дія доступна тільки з правого кліку — на тачі до неї не дістатись.",
     pl:"Akcja jest tylko pod prawym kliknięciem — na dotyku nie da się do niej dojść.",
     en:"That action is right-click only — there's no way to reach it on touch."},
 d:`<div class="scene"><div class="pg"><div class="bar m"></div><div class="bar"></div></div>
  <div class="menu" style="position:absolute;left:38px;top:38px;width:120px">
   <a style="font-size:11px"><span>Kopiuj symbol</span></a>
   <a style="font-size:11px"><span>Dodaj do BOM</span></a>
   <hr><a class="dg" style="font-size:11px"><span>Usuń</span></a>
  </div>
 </div>`},

{c:"D",n:"10",en:"Mega menu",alt:"wide dropdown nav",pl:"mega menu",
 ua:"Широка панель з усіма категоріями одразу. Виправдана в каталогах на сотні розділів; вимагає затримки перед відкриттям (~150 мс), щоб не спрацьовувати випадково.",
 o:{pl:"Szeroki panel ze wszystkimi kategoriami naraz. Uzasadniony w katalogach o setkach działów; wymaga opóźnienia przed otwarciem (~150 ms), żeby nie odpalał się przypadkiem.",
    en:"A wide panel showing every category at once. Justified in catalogues with hundreds of sections; needs a delay before opening (~150 ms) so it doesn't fire by accident."},
 ex:{ua:"Мега-меню вискакує від випадкового руху — постав затримку 150 мс.",
     pl:"Mega menu odpala się od przypadkowego ruchu — daj opóźnienie 150 ms.",
     en:"The mega menu fires on an accidental sweep — add a 150 ms delay."},
 d:`<div class="scene"><div style="padding:7px 9px;border-bottom:1px solid var(--line);font-size:9.5px;font-family:var(--mono);color:var(--pcb)">Katalog ▾</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:9px;font-size:8.5px;line-height:1.9;color:var(--muted)">
   <div><b style="color:var(--ink)">Bierne</b><br>Rezystory<br>Kondensatory</div>
   <div><b style="color:var(--ink)">Aktywne</b><br>Diody<br>Tranzystory</div>
   <div><b style="color:var(--ink)">Mech.</b><br>Złącza<br>Obudowy</div>
  </div>
 </div>`},

{c:"D",n:"11",en:"Stepper (progress steps)",alt:"wizard, progress indicator",pl:"wskaźnik kroków",
 ua:"Показує, де користувач у багатокроковому процесі. Обов'язковий у чекауті: знімає тривогу «скільки ще залишилось».",
 o:{pl:"Pokazuje, gdzie użytkownik jest w wielokrokowym procesie. Obowiązkowy w koszyku: zdejmuje niepokój «ile jeszcze zostało».",
    en:"Shows where the user is in a multi-step process. Mandatory at checkout: it removes the 'how much is left' anxiety."},
 ex:{ua:"Додай індикатор кроків у чекаут — люди не знають, скільки ще лишилось.",
     pl:"Dodaj wskaźnik kroków w koszyku — ludzie nie wiedzą, ile jeszcze zostało.",
     en:"Add a step indicator to checkout — people don't know how much is left."},
 d:`<div class="steps">
  <div class="s done"><b>✓︎</b><span>Koszyk</span></div><div class="ln done"></div>
  <div class="s now"><b>2</b><span>Dostawa</span></div><div class="ln"></div>
  <div class="s"><b>3</b><span>Płatność</span></div>
 </div>`},

{c:"D",n:"12",en:"Command palette",alt:"quick actions, ⌘︎K",pl:"paleta poleceń",
 ua:"Пошук по всіх діях застосунку з клавіатури. Прискорювач для досвідчених — ніколи не єдиний шлях до функції.",
 o:{pl:"Wyszukiwanie wszystkich akcji aplikacji z klawiatury. Przyspieszacz dla zaawansowanych — nigdy jedyna droga do funkcji.",
    en:"Keyboard search across every action in the app. An accelerator for power users — never the only way to a feature."},
 ex:{ua:"Палітра команд це прискорювач, а не єдиний шлях — лиши функцію і в меню.",
     pl:"Paleta poleceń to przyspieszacz, a nie jedyna droga — zostaw funkcję też w menu.",
     en:"The command palette is an accelerator, not the only route — keep the feature in the menu too."},
 d:`<div class="cmdk">
  <div class="q"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.4"/><path d="m20 20-4.4-4.4"/></svg> zam…</div>
  <div class="g">ZAMÓWIENIA</div>
  <div class="it on"><span>Nowe zamówienie</span><span style="font-family:var(--mono);font-size:10px;color:var(--muted)">⌘︎N</span></div>
  <div class="it"><span>Historia zamówień</span></div>
  <div class="g">USTAWIENIA</div>
  <div class="it"><span>Zamknij konto</span></div>
 </div>`},

{c:"D",n:"13",en:"Toolbar",alt:"action bar",pl:"pasek narzędzi",
 ua:"Групa інструментів над контентом. Порядок = частота використання, не алфавіт.",
 o:{pl:"Grupa narzędzi nad treścią. Kolejność wynika z częstotliwości użycia, nie z alfabetu.",
    en:"A group of tools above the content. Order by how often things are used, not alphabetically."},
 ex:{ua:"Переставь інструменти за частотою використання, а не за абеткою.",
     pl:"Poprzestawiaj narzędzia według częstotliwości użycia, a nie alfabetycznie.",
     en:"Reorder the toolbar by frequency of use, not alphabetically."},
 d:`<div class="tbar">
  <button class="on"><b>B</b></button><button><i>I</i></button><button><u>U</u></button>
  <div class="sp"></div><button>≡</button><button>⌸︎</button><button><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.8a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.3 1.3"/><path d="M14 10.2a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.3-1.3"/></svg></button>
 </div>`},

{c:"D",n:"14",en:"Bottom navigation",alt:"tab bar (mobile)",pl:"dolna nawigacja",
 ua:"3–5 головних розділів у зоні великого пальця. Не для дій — тільки для навігації верхнього рівня.",
 o:{pl:"3–5 głównych działów w zasięgu kciuka. Nie do akcji — wyłącznie do nawigacji najwyższego poziomu.",
    en:"Three to five main sections within thumb reach. Not for actions — top-level navigation only."},
 ex:{ua:"У нижній навігації має бути максимум 5 розділів, і жодних дій.",
     pl:"W dolnej nawigacji ma być maksymalnie 5 działów i żadnych akcji.",
     en:"Bottom navigation takes five sections maximum, and no actions."},
 d:`<div class="bnav">
  <div class="on"><b>⌂︎</b>Start</div><div><b>▤︎</b>Katalog</div><div><b><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2.6l2.7 12.3a1.4 1.4 0 0 0 1.4 1.1h8.6a1.4 1.4 0 0 0 1.4-1.1L21 7.2H6"/></svg></b>Koszyk</div><div><b>☰</b>Konto</div>
 </div>`},

{c:"D",n:"15",en:"Hamburger menu",alt:"nav toggle",pl:"menu hamburgerowe",
 ua:"Іконка з трьох ліній, що ховає навігацію. На мобільному — норма, на десктопі — свідомо приховує розділи й падає їхнє використання.",
 o:{pl:"Ikona z trzech kresek chowająca nawigację. Na mobile to norma, na desktopie świadomie ukrywa działy i ich użycie spada.",
    en:"The three-line icon that hides the navigation. Normal on mobile; on desktop it deliberately hides sections and their usage drops."},
 ex:{ua:"На десктопі не ховай розділи в бургер — їх перестануть відкривати.",
     pl:"Na desktopie nie chowaj działów do hamburgera — przestaną je otwierać.",
     en:"Don't hide the sections behind a hamburger on desktop — people stop opening them."},
 d:`<div class="row"><button class="b b-s b-i" aria-label="Menu">☰</button><span class="cap">≡ ukryta nawigacja</span></div>`},

{c:"D",n:"16",en:"Skip link",alt:"skip to content",pl:"link pomijający",
 ua:"Прихована ланка, що з'являється на першому Tab і веде одразу до контенту. Обов'язкова за WCAG 2.4.1 — часто забувають.",
 o:{pl:"Ukryty odnośnik, który pojawia się przy pierwszym Tabie i prowadzi wprost do treści. Wymagany przez WCAG 2.4.1 — często się o nim zapomina.",
    en:"A hidden link that appears on the first Tab press and jumps straight to the content. Required by WCAG 2.4.1 — and routinely forgotten."},
 ex:{ua:"Бракує skip link — з клавіатури доводиться протабати все меню.",
     pl:"Brakuje linku pomijającego — z klawiatury trzeba przetabować całe menu.",
     en:"There's no skip link — from the keyboard you have to tab through the whole menu."},
 d:`<div class="row"><span class="skip">Przejdź do treści</span></div>`},

/* ============ E · КОНТЕЙНЕРИ ============ */
{c:"E",n:"01",en:"Card",alt:"tile",pl:"karta",
 ua:"Контейнер для пов'язаного набору даних, який працює як одна одиниця. Якщо картка не клікабельна цілком — це просто блок, не картка.",
 o:{pl:"Kontener na powiązany zestaw danych, który działa jako jedna całość. Jeśli karta nie jest klikalna w całości — to zwykły blok, a nie karta.",
    en:"A container for a related set of data that behaves as one unit. If the whole thing isn't clickable, it's just a block, not a card."},
 ex:{ua:"Клікає тільки заголовок — зроби клікабельною всю картку.",
     pl:"Klikalny jest tylko tytuł — zrób klikalną całą kartę.",
     en:"Only the title is clickable — make the whole card clickable."},
 d:`<div class="card"><div class="ph"></div><div class="bd">
  <h4>Rezystor SMD 4,7 kΩ</h4><p>0805 · ±1% · 125 mW</p>
  <button class="b b-s" style="font-size:11.5px;padding:6px 10px">Zobacz</button>
 </div></div>`},

{c:"E",n:"02",en:"Accordion",alt:"expandable sections",pl:"akordeon",
 ua:"Стос секцій, які розгортаються. Добре для FAQ і специфікацій; погано для контенту, який треба порівнювати між собою.",
 o:{pl:"Stos rozwijanych sekcji. Dobry do FAQ i specyfikacji; zły do treści, które trzeba ze sobą porównywać.",
    en:"A stack of expandable sections. Good for FAQs and specifications; bad for content you need to compare side by side."},
 ex:{ua:"Специфікації в акордеон не клади — їх порівнюють між собою.",
     pl:"Nie wkładaj specyfikacji w akordeon — porównuje się je między sobą.",
     en:"Don't put the specs in an accordion — people compare them against each other."},
 d:`<div style="width:100%;max-width:260px">
  <details class="acc" open><summary>Parametry elektryczne</summary><p>Rezystancja 4,7 kΩ · Tolerancja ±1% · Moc 0,125 W</p></details>
  <details class="acc"><summary>Wymiary</summary><p>2,0 × 1,25 × 0,45 mm</p></details>
  <details class="acc"><summary>Dokumenty</summary><p>Karta katalogowa, deklaracja RoHS</p></details>
 </div>`},

{c:"E",n:"03",en:"Disclosure",alt:"collapsible, show more",pl:"rozwijana sekcja",
 ua:"Одна секція «показати/сховати». На відміну від акордеона тут немає групи — це просто прогресивне розкриття деталей.",
 o:{pl:"Jedna sekcja «pokaż/ukryj». W odróżnieniu od akordeonu nie ma tu grupy — to po prostu stopniowe odsłanianie szczegółów.",
    en:"A single show/hide section. Unlike an accordion there's no group — it's simply revealing detail step by step."},
 ex:{ua:"Сховай технічні деталі під «pokaż więcej» — більшості вони не потрібні.",
     pl:"Schowaj szczegóły techniczne pod «pokaż więcej» — większości nie są potrzebne.",
     en:"Tuck the technical detail behind a 'show more' — most people don't need it."},
 note:"Патерн називається <b>progressive disclosure</b> — стопенєве ujawnianie informacji.",
 nt:{pl:"Wzorzec nazywa się <b>progressive disclosure</b> — stopniowe ujawnianie informacji.",
     en:"The pattern is called <b>progressive disclosure</b> — revealing information gradually."},
 d:`<details class="acc" style="max-width:250px"><summary>Pokaż 12 zamienników</summary><p>LM358P · LM358AN · TL072CP · NE5532P …</p></details>`},

{c:"E",n:"04",en:"Divider",alt:"separator, rule",pl:"separator",
 ua:"Лінія, що розділяє смислові групи. Часто зайва — відступ робить те саме тихіше. Використовуй, коли простору бракує.",
 o:{pl:"Linia rozdzielająca grupy znaczeniowe. Często zbędna — odstęp robi to samo ciszej. Stosuj, gdy brakuje miejsca.",
    en:"A line separating meaningful groups. Often unnecessary — spacing does the same job more quietly. Use it when space is tight."},
 ex:{ua:"Тут вистачить відступу замість лінії — сепаратор зайвий шум.",
     pl:"Tu wystarczy odstęp zamiast kreski — separator to zbędny szum.",
     en:"Spacing is enough here instead of a rule — the divider is just noise."},
 d:`<div class="divi">
  <div class="d" style="font-size:12px">Dane firmy</div><hr>
  <div class="d" style="font-size:12px">Adres dostawy</div>
  <div class="lbl" style="margin:9px 0">lub</div>
  <div class="d" style="font-size:12px">Odbiór osobisty</div>
 </div>`},

{c:"E",n:"05",en:"List",alt:"list item, row",pl:"lista",
 ua:"Вертикальний перелік однотипних елементів. Рядок = один об'єкт + одна головна дія. Більше двох дій у рядку — вже меню.",
 o:{pl:"Pionowe zestawienie jednorodnych elementów. Wiersz = jeden obiekt plus jedna główna akcja. Więcej niż dwie akcje w wierszu to już menu.",
    en:"A vertical run of similar items. One row = one object plus one main action. More than two actions in a row means it's a menu."},
 ex:{ua:"Чотири дії в рядку — сховай їх у меню, лиши одну головну.",
     pl:"Cztery akcje w wierszu — schowaj je do menu, zostaw jedną główną.",
     en:"Four actions in a row — move them into a menu and keep one primary."},
 d:`<div class="lst">
  <div>Zamówienie #48120 <small>12.09</small></div>
  <div>Zamówienie #48095 <small>09.09</small></div>
  <div>Zamówienie #47988 <small>02.09</small></div>
 </div>`},

{c:"E",n:"06",en:"Table",alt:"static table",pl:"tabela",
 ua:"Дані в рядках і колонках для порівняння. Числа — вирівнювання по правому краю й моноширинний шрифт, інакше порядок величин не зчитується.",
 o:{pl:"Dane w wierszach i kolumnach do porównywania. Liczby wyrównuj do prawej i składaj pismem o stałej szerokości, inaczej nie widać rzędów wielkości.",
    en:"Data in rows and columns for comparison. Right-align numbers and set them in a monospaced face, otherwise the orders of magnitude don't read."},
 ex:{ua:"Вирівняй числа праворуч і постав табличні цифри — інакше порядки не видно.",
     pl:"Wyrównaj liczby do prawej i daj cyfry tabelaryczne — inaczej nie widać rzędów wielkości.",
     en:"Right-align the numbers and use tabular figures — otherwise you can't see the magnitudes."},
 d:`<table class="t">
  <tr><th>Symbol</th><th>Obudowa</th><th>Cena</th></tr>
  <tr><td>RS-4K7-0805</td><td>0805</td><td class="n">0,08 zł</td></tr>
  <tr><td>RS-10K-0805</td><td>0805</td><td class="n">0,08 zł</td></tr>
  <tr><td>RS-4K7-0603</td><td>0603</td><td class="n">0,11 zł</td></tr>
 </table>`},

{c:"E",n:"07",en:"Data table",alt:"data grid",pl:"tabela danych",
 ua:"Інтерактивна таблиця: сортування, фільтри, вибір рядків, масові дії, закріплені колонки. Ядро будь-якого B2B-інтерфейсу.",
 o:{pl:"Interaktywna tabela: sortowanie, filtry, zaznaczanie wierszy, akcje masowe, przypięte kolumny. Rdzeń każdego interfejsu B2B.",
    en:"An interactive table: sorting, filters, row selection, bulk actions, pinned columns. The core of any B2B interface."},
 ex:{ua:"Закріпи першу колонку — при 20 колонках незрозуміло, чий це рядок.",
     pl:"Przypnij pierwszą kolumnę — przy 20 kolumnach nie wiadomo, czyj to wiersz.",
     en:"Pin the first column — with 20 columns you lose track of which row you're on."},
 note:"У ARIA інтерактивна версія називається <b>grid</b>, статична — <b>table</b>. Різниця в клавіатурній навігації стрілками.",
 nt:{pl:"W ARIA wersja interaktywna nazywa się <b>grid</b>, statyczna — <b>table</b>. Różnica jest w nawigacji strzałkami z klawiatury.",
     en:"In ARIA the interactive version is a <b>grid</b> and the static one a <b>table</b>. The difference is keyboard arrow navigation."},
 d:`<table class="t">
  <tr><th><input type="checkbox" style="accent-color:var(--pcb)"></th><th>Symbol ↓</th><th>Stan</th><th>Cena</th></tr>
  <tr><td><input type="checkbox" checked style="accent-color:var(--pcb)"></td><td>LM358N</td><td class="n">2 400</td><td class="n">1,24 zł</td></tr>
  <tr><td><input type="checkbox" style="accent-color:var(--pcb)"></td><td>NE555P</td><td class="n">860</td><td class="n">0,98 zł</td></tr>
 </table>`},

{c:"E",n:"08",en:"Tree view",alt:"tree, hierarchy",pl:"widok drzewa",
 ua:"Ієрархія з розгортанням гілок. Природна форма для категорій каталогу й структури BOM.",
 o:{pl:"Hierarchia z rozwijaniem gałęzi. Naturalna forma dla kategorii katalogu i struktury BOM.",
    en:"A hierarchy with expandable branches. The natural shape for catalogue categories and a BOM structure."},
 ex:{ua:"Структуру BOM показуй деревом, а не пласким списком.",
     pl:"Strukturę BOM pokaż drzewem, a nie płaską listą.",
     en:"Show the BOM structure as a tree, not a flat list."},
 d:`<div class="tree">
  <details open><summary>Elementy bierne</summary>
    <details open><summary>Rezystory</summary><i>SMD</i><i>THT</i></details>
    <details><summary>Kondensatory</summary></details>
  </details>
 </div>`},

{c:"E",n:"09",en:"Scroll area",alt:"scroll container",pl:"obszar przewijania",
 ua:"Обмежена зона з власним скролом. Внутрішній скрол усередині сторінкового — часта причина «загубленого» контенту.",
 o:{pl:"Ograniczona strefa z własnym przewijaniem. Scroll wewnętrzny w scrollu strony to częsta przyczyna «zgubionej» treści.",
    en:"A bounded area with its own scrollbar. A scroll inside the page scroll is a common cause of content people never find."},
 ex:{ua:"Скрол у скролі — контент усередині ніхто не догортає.",
     pl:"Scroll w scrollu — treści w środku nikt nie doprzewija.",
     en:"A scroll inside a scroll — nobody ever reaches the content inside."},
 d:`<div class="scr">Regulamin sprzedaży<br><br>§1. Postanowienia ogólne. Sprzedawcą jest spółka wpisana do rejestru przedsiębiorców.<br><br>§2. Zamówienia przyjmowane są przez sklep internetowy.<br><br>§3. Ceny podane są w złotych polskich.<br><br>§4. Dostawa realizowana jest na terenie RP.</div>`},

{c:"E",n:"10",en:"Split view",alt:"resizable panes",pl:"widok dzielony",
 ua:"Дві панелі з рухомим роздільником. Патерн master–detail: список зліва, деталі справа. У ARIA роздільник — window splitter.",
 o:{pl:"Dwa panele z ruchomym rozdzielaczem. Wzorzec master–detail: lista po lewej, szczegóły po prawej. W ARIA rozdzielacz to window splitter.",
    en:"Two panes with a draggable divider. The master–detail pattern: list on the left, detail on the right. In ARIA the divider is a window splitter."},
 ex:{ua:"Зроби split view — список ліворуч, деталі праворуч, без переходів.",
     pl:"Zrób widok dzielony — lista po lewej, szczegóły po prawej, bez przeładowań.",
     en:"Make it a split view — list on the left, detail on the right, no page changes."},
 d:`<div class="split2">
  <div class="p1">Lista<br>pozycji</div><div class="hnd"></div><div class="p2">Szczegóły wybranej pozycji</div>
 </div>`},

{c:"E",n:"11",en:"Grid",alt:"layout grid, columns",pl:"siatka",
 ua:"Модульна сітка з колонок і жолобів. Не компонент, а каркас усього макета — 12 колонок для десктопа, 4 для мобільного.",
 o:{pl:"Siatka modułowa z kolumn i rynien. Nie komponent, tylko szkielet całej makiety — 12 kolumn na desktop, 4 na mobile.",
    en:"A modular grid of columns and gutters. Not a component but the skeleton of the whole layout — 12 columns on desktop, 4 on mobile."},
 ex:{ua:"Прив'яжи блоки до сітки — зараз кожен живе своїм життям.",
     pl:"Przypnij bloki do siatki — teraz każdy żyje własnym życiem.",
     en:"Snap the blocks to the grid — right now each one does its own thing."},
 note:"Не плутати з <b>data grid</b> (E·07). Тут — siatka layoutowa.",
 nt:{pl:"Nie mylić z <b>data grid</b> (E·07). Tutaj chodzi o siatkę layoutową.",
     en:"Not to be confused with a <b>data grid</b> (E·07). This is the layout grid."},
 d:`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:230px">
  <div style="height:34px;background:var(--pcb-soft);border:1px solid #C6DED4;border-radius:2px"></div>
  <div style="height:34px;background:var(--pcb-soft);border:1px solid #C6DED4;border-radius:2px"></div>
  <div style="height:34px;background:var(--pcb-soft);border:1px solid #C6DED4;border-radius:2px"></div>
  <div style="height:34px;background:var(--pcb-soft);border:1px solid #C6DED4;border-radius:2px"></div>
  <div style="grid-column:span 2;height:34px;background:var(--brass-soft);border:1px solid #E5D9BD;border-radius:2px"></div>
  <div style="grid-column:span 2;height:34px;background:var(--brass-soft);border:1px solid #E5D9BD;border-radius:2px"></div>
 </div>`},

{c:"E",n:"12",en:"Sticky element",alt:"pinned, affix",pl:"element przyklejony",
 ua:"Залипає при скролі: шапка таблиці, панель фільтрів, кнопка «do koszyka» на мобільному. Кожен sticky відбирає висоту екрана — рахуй сумарно.",
 o:{pl:"Przykleja się przy przewijaniu: nagłówek tabeli, panel filtrów, przycisk «do koszyka» na mobile. Każdy sticky zabiera wysokość ekranu — licz je łącznie.",
    en:"Sticks while scrolling: a table header, a filter bar, the add-to-cart button on mobile. Every sticky element eats screen height — count them together."},
 ex:{ua:"Три липкі елементи з'їли пів екрана — лиши один.",
     pl:"Trzy przyklejone elementy zjadły pół ekranu — zostaw jeden.",
     en:"Three sticky elements ate half the screen — keep one."},
 d:`<div class="scene"><div style="position:absolute;top:0;left:0;right:0;background:var(--ink);color:#fff;font-size:9px;font-family:var(--mono);padding:6px 9px;z-index:2">SYMBOL · STAN · CENA</div>
  <div class="pg" style="padding-top:26px"><div class="bar"></div><div class="bar m"></div><div class="bar s"></div><div class="bar"></div></div>
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--pcb);color:#fff;font-size:10px;text-align:center;padding:7px">Dodaj do koszyka · 310,00 zł</div>
 </div>`},

/* ============ F · ОВЕРЛЕЇ ============ */
{c:"F",n:"01",en:"Modal",alt:"dialog, modal window",pl:"okno modalne",
 ua:"Блокує інтерфейс до відповіді. Потребує фокус-трапа, закриття по Esc і повернення фокуса на кнопку-джерело. Використовуй рідко — це перебивання задачі.",
 o:{pl:"Blokuje interfejs do czasu odpowiedzi. Wymaga pułapki fokusa, zamykania Escape i powrotu fokusa na przycisk źródłowy. Stosuj rzadko — to przerwanie zadania.",
    en:"Blocks the interface until it's answered. It needs a focus trap, Escape to close and focus returned to the triggering button. Use it sparingly — it interrupts the task."},
 ex:{ua:"Тут модалка зайва — це не переривання, винеси в drawer.",
     pl:"Tu okno modalne jest zbędne — to nie przerwanie, wynieś do panelu wysuwanego.",
     en:"A modal is overkill here — this isn't an interruption, put it in a drawer."},
 note:"Польською також <b>okno dialogowe</b>. Модальність = «modalność» — те, що блокує тло.",

     en:"Polish also says <b>okno dialogowe</b>. Modality is precisely the part that blocks the background."},

{c:"F",n:"02",en:"Alert dialog",alt:"confirmation dialog",pl:"okno potwierdzenia",
 ua:"Підтвердження незворотної дії. Кнопка має називати саму дію («Usuń zamówienie»), а не «Tak» — тоді рішення читається без заголовка.",
 o:{pl:"Potwierdzenie nieodwracalnej akcji. Przycisk ma nazywać samą akcję («Usuń zamówienie»), a nie «Tak» — wtedy decyzja czyta się bez nagłówka.",
    en:"Confirmation of an irreversible action. The button should name the action ('Delete order') rather than say 'Yes' — then the decision reads without the heading."},

     pl:"Zamiast «Tak» napisz na przycisku samą akcję — «Usuń zamówienie».",
     en:"Instead of 'Yes', put the action on the button — 'Delete order'."},
 d:`<div class="scene"><div class="pg"><div class="bar m"></div><div class="bar"></div></div>
  <div class="scrim"></div>
  <div class="dlg"><h5>Usunąć listę BOM?</h5><p>Tej operacji nie można cofnąć.</p>
   <div class="act"><button class="b b-s">Zachowaj</button><button class="b b-d">Usuń listę</button></div></div>
 </div>`},

{c:"F",n:"03",en:"Drawer",alt:"side sheet, off-canvas",pl:"panel wysuwany",
 ua:"Виїжджає збоку, не розриваючи контекст сторінки. Ідеально для кошика, фільтрів і деталей рядка таблиці.",

     pl:"Filtry do panelu wysuwanego, a nie do modala — kontekst listy ma zostać.",
     en:"Put the filters in a drawer, not a modal — the list context has to stay."},

     en:"Apple HIG calls it a <b>sheet</b>, Material a <b>side sheet</b>. Polish teams often just say <b>szuflada</b> or <b>drawer</b>."},

  <div class="scrim"></div>
  <div class="drw"><h5>Koszyk <span>✕︎</span></h5>

  </div>
 </div>`},

{c:"F",n:"04",en:"Bottom sheet",alt:"mobile sheet",pl:"dolny panel wysuwany",
 ua:"Мобільний аналог drawer, знизу. Grabber (риска зверху) підказує, що панель тягнеться. Має мати кілька позицій висоти.",

   <div style="font-size:10px;color:var(--muted);line-height:2">Cena rosnąco<br>Dostępność<br>Trafność</div>
  </div>
 </div>`},

{c:"F",n:"05",en:"Popover",alt:"popup panel",pl:"wyskakujący panel",
 ua:"Невеликий контейнер, прив'язаний до елемента, з інтерактивним вмістом усередині. На відміну від tooltip — можна клікати і фокусувати.",
 o:{pl:"Niewielki kontener przypięty do elementu, z interaktywną treścią w środku. W odróżnieniu od podpowiedzi można w niego klikać i ustawiać fokus.",

     en:"This needs a popover, not a tooltip — there's a button inside."},
 d:`<div class="scene"><div class="pg"><div class="bar s"></div><div class="bar m"></div></div>
  <div style="position:absolute;left:14px;top:30px;font-size:10px;border-bottom:1.5px dotted var(--muted)">Cena progowa ⓘ︎</div>
  <div class="pop">od 500 szt. &nbsp;0,06 zł<br>od 5 000 szt. &nbsp;0,04 zł</div>
 </div>`},

{c:"F",n:"06",en:"Tooltip",alt:"hint bubble",pl:"podpowiedź",
 ua:"Короткий пояснювальний текст при наведенні або фокусі. Тільки текст, без кнопок і посилань. Ніколи не носій критичної інформації — на тачі його немає.",
 o:{pl:"Krótki tekst objaśniający przy najechaniu albo fokusie. Tylko tekst, bez przycisków i linków. Nigdy nie nośnik krytycznej informacji — na dotyku go nie ma.",
    en:"A short explanatory text on hover or focus. Text only, no buttons or links. Never the carrier of critical information — it doesn't exist on touch."},
 ex:{ua:"У tooltip не клади важливе — на телефоні його просто нема.",
     pl:"Nie wkładaj do tooltipa rzeczy ważnych — na telefonie go po prostu nie ma.",
     en:"Don't put anything important in a tooltip — it simply doesn't exist on a phone."},
 note:"Наведи курсор на приклад. Польською також <b>dymek</b>; у мовленні — <b>tooltip</b>.",
 nt:{pl:"Najedź kursorem na przykład. Po polsku także <b>dymek</b>; w mowie — <b>tooltip</b>.",
     en:"Hover over the example. Polish also says <b>dymek</b>; in speech it's <b>tooltip</b>."},
 d:`<div class="row" style="padding:14px 0">
  <span class="tipw"><span class="trg" tabindex="0">MOQ</span><span class="tip">Minimalna wielkość zamówienia</span></span>
  <span class="cap">← najedź kursorem</span>
 </div>`},

{c:"F",n:"07",en:"Hover card",alt:"preview card",pl:"karta podglądu",
 ua:"Багатший за tooltip прев'ю при наведенні: зображення, метадані, дії. Затримка перед появою обов'язкова (~300 мс).",
 o:{pl:"Bogatszy od podpowiedzi podgląd przy najechaniu: obrazek, metadane, akcje. Opóźnienie przed pojawieniem się jest obowiązkowe (~300 ms).",
    en:"A richer hover preview than a tooltip: image, metadata, actions. A delay before it appears is mandatory (~300 ms)."},

     pl:"Karta podglądu wyskakuje natychmiast i przeszkadza — daj opóźnienie 300 ms.",
     en:"The hover card fires instantly and gets in the way — add a 300 ms delay."},
 d:`<div class="hcard">
  <div class="hd"><div class="av br">TI</div><div><div style="font-size:12px;font-weight:600">Texas Instruments</div><div class="cap">Producent · 1 240 poz.</div></div></div>
  <p>Dostawa 24 h z magazynu w Rzgowie. Autoryzowany dystrybutor.</p>
 </div>`},

{c:"F",n:"08",en:"Backdrop",alt:"scrim, overlay",pl:"przyciemnienie tła",
 ua:"Напівпрозорий шар під модалкою: фокусує увагу і робить тло неактивним. Клік по ньому має закривати немодальні панелі.",

    en:"A translucent layer under a modal: it focuses attention and deactivates the background. Clicking it should close non-modal panels."},

     pl:"Kliknięcie w przyciemnienie ma zamykać panel — teraz nic się nie dzieje.",
     en:"Clicking the backdrop should close the panel — right now nothing happens."},

 nt:{pl:"Material nazywa to <b>scrim</b>. Po polsku — <b>przyciemnienie</b> / <b>nakładka</b>.",
     en:"Material calls this a <b>scrim</b>. Polish uses <b>przyciemnienie</b> or <b>nakładka</b>."},
 d:`<div class="scene"><div class="pg"><div class="bar m"></div><div class="bar"></div><div class="bar s"></div></div>
  <div class="scrim"></div>
  <div style="position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#fff;font:500 9px var(--mono);letter-spacing:.08em">rgba(20,24,26,.42)</div>
 </div>`},

{c:"F",n:"09",en:"Lightbox",alt:"image viewer",pl:"powiększenie zdjęcia",

 </div>`},

{c:"F",n:"10",en:"Banner",alt:"system banner, notification bar",pl:"baner informacyjny",

{c:"G",n:"01",en:"Toast",alt:"snackbar",pl:"powiadomienie tymczasowe",
 ua:"Коротке підтвердження дії, зникає само за 4–6 с. Не для помилок, які треба прочитати. Дія «Cofnij» усередині — найкорисніший патерн.",
 o:{pl:"Krótkie potwierdzenie akcji, znika samo po 4–6 s. Nie do błędów, które trzeba przeczytać. Akcja «Cofnij» w środku to najbardziej użyteczny wzorzec.",
    en:"A short confirmation of an action that disappears by itself after 4–6 s. Not for errors that must be read. An 'Undo' action inside it is the most useful pattern."},

     pl:"Nie wrzucaj błędu do toasta — zniknie, zanim ktoś go przeczyta.",
     en:"Don't put the error in a toast — it'll be gone before anyone reads it."},
 note:"Material називає це <b>snackbar</b>. У польських командах — <b>toast</b>.",
 nt:{pl:"Material nazywa to <b>snackbar</b>. W polskich zespołach mówi się <b>toast</b>.",
     en:"Material calls this a <b>snackbar</b>. Polish teams say <b>toast</b>."},

{c:"G",n:"02",en:"Alert",alt:"inline message, callout",pl:"komunikat",

    en:"A message embedded where the problem or context is. It stays on screen. Four tones: info, success, warning, error."},

     pl:"Daj komunikat przy polu, a nie na górze strony — tam, gdzie jest problem.",
     en:"Put the alert next to the field, not at the top of the page — where the problem is."},
 d:`<div class="col">
  <div class="al al-i">ⓘ︎ <div><b>Cena progowa</b>Od 500 szt. cena spada do 0,06 zł.</div></div>
  <div class="al al-w">⚑︎ <div><b>Niski stan</b>Zostało 42 szt. w magazynie.</div></div>
  <div class="al al-e">⚠︎ <div><b>Płatność odrzucona</b>Sprawdź dane karty.</div></div>
 </div>`},

{c:"G",n:"03",en:"Badge",alt:"counter, notification dot",pl:"znacznik liczbowy",

  <span class="bwrap"><button class="b b-s b-i"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3.2 6.7 12 13l8.8-6.3"/></svg></button><span class="badge">99+</span></span>
  <span class="bwrap"><button class="b b-s b-i"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.6a6 6 0 1 0-12 0c0 5.6-2 6.9-2 6.9h16s-2-1.3-2-6.9"/><path d="M10.2 19.4a2.2 2.2 0 0 0 3.6 0"/></svg></button><span class="badge dot"></span></span>

{c:"G",n:"04",en:"Status indicator",alt:"status pill, state chip",pl:"wskaźnik statusu",
 ua:"Показує стан об'єкта. Колір + текст + іконка — колір сам по собі не читається дальтоніками (8% чоловіків).",
 o:{pl:"Pokazuje stan obiektu. Kolor plus tekst plus ikona — sam kolor nie czyta się dla daltonistów (8% mężczyzn).",

     pl:"Sam kolor statusu się nie czyta — dodaj tekst i ikonę.",
     en:"Colour alone doesn't convey the status — add text and an icon."},

  <span class="pill ok"><i></i>Na magazynie</span>
  <span class="pill wr"><i></i>Na zamówienie</span>
  <span class="pill no"><i></i>Wycofany</span>

{c:"G",n:"05",en:"Progress bar",alt:"determinate progress",pl:"pasek postępu",
 ua:"Прогрес із відомим завершенням. Показуй відсоток або «3 z 5» — сама смуга без числа не знімає невизначеності.",

     en:"Put a number on the bar — '3 of 5' answers how much is left."},

  <div class="mt"><span>Import BOM</span><span>64% · 320/500</span></div>
 </div>`},

{c:"G",n:"06",en:"Indeterminate progress",alt:"loading bar",pl:"pasek nieokreślony",
 ua:"Тривалість невідома. Використовуй, коли не можеш порахувати прогрес — але додай текст, що саме відбувається.",
 o:{pl:"Czas trwania nieznany. Stosuj, gdy nie da się policzyć postępu — ale dopisz, co się właściwie dzieje.",
    en:"The duration is unknown. Use it when progress can't be measured — but add text saying what's actually happening."},

     pl:"Jeśli nie umiemy policzyć postępu — napisz chociaż, co się teraz dzieje.",
     en:"If we can't measure progress, at least say what's happening."},
 d:`<div class="prog ind"><div class="tr"><div class="fl"></div></div>
  <div class="mt"><span>Sprawdzanie dostępności…</span><span></span></div>
 </div>`},

{c:"G",n:"07",en:"Spinner",alt:"loader, activity indicator",pl:"wskaźnik ładowania",
 ua:"Кругове очікування. До ~1 с краще нічого не показувати, після ~10 с — потрібен текст або скасування.",

    en:"A circular wait. Under ~1 s show nothing at all; after ~10 s you need text or a way to cancel."},

     pl:"Wskaźnik ładowania wisi 15 sekund bez wyjaśnień — dodaj tekst i anulowanie.",
     en:"The spinner hangs for 15 seconds with no explanation — add text and a cancel."},
 d:`<div class="row" style="gap:20px">
  <div class="spin"></div>
  <div class="dots"><span></span><span></span><span></span></div>
 </div>`},

{c:"G",n:"08",en:"Skeleton",alt:"placeholder loader",pl:"szkielet ładowania",
 ua:"Сірий каркас майбутнього контенту. Знижує відчуття очікування краще за спінер, бо показує структуру наперед.",

    en:"A grey skeleton of the content to come. It reduces the feeling of waiting better than a spinner because it shows the structure in advance."},
