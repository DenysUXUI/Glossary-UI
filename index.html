const CATS = {
  A:["Дії","Akcje"], B:["Поля вводу","Pola i formularze"], C:["Вибір і перемикання","Wybór"],
  D:["Навігація","Nawigacja"], E:["Контейнери","Kontenery"], F:["Оверлеї","Warstwy nakładane"],
  G:["Статус і фідбек","Komunikaty"], H:["Контент і дані","Treść i dane"],
  I:["E-commerce","Handel elektroniczny"], J:["Стани й анатомія","Stany i anatomia"],
  K:["Відступи й сітка","Odstępy i układ"], L:["Типографіка","Typografia"]
};
const ORDER = Object.keys(CATS);

/* пари, які найчастіше плутають — для карток рівня 5 */
const PAIRS = [
  ["F-06","F-05","F-07"], ["F-01","F-03","F-04"], ["F-01","F-02"],
  ["C-04","C-01"], ["C-01","C-03"], ["C-05","C-06","C-08"],
  ["A-05","A-04","D-05"], ["A-01","A-07"], ["A-02","A-03"],
  ["H-03","G-03","G-04"], ["G-01","G-02","F-10"], ["G-08","G-07","G-05"],
  ["G-05","G-11"], ["G-09","G-10"], ["E-06","E-07"], ["E-02","E-03"],
  ["C-11","D-11"], ["B-04","B-05","B-03"], ["D-03","D-04"], ["D-06","D-11"],
  ["K-01","K-02","K-03"], ["K-03","K-04"], ["K-06","K-07"],
  ["L-03","L-04","L-05"], ["L-01","L-02"], ["L-11","L-12"], ["J-07","K-18"]
];

/* ---------- helpers ---------- */
const strip = s => (s||"").replace(/<[^>]*>/g,"");
DATA.forEach(e => {
  e.id = e.c+"-"+e.n;
  const more = [].concat(Object.values(e.o||{}), Object.values(e.nt||{}), Object.values(e.ex||{}));
  e.hay = [e.en,e.alt,e.pl,strip(e.ua),strip(e.note)].concat(more.map(strip)).concat(e.id).join(" ").toLowerCase();
});
const BY_ID = {}; DATA.forEach(e => BY_ID[e.id] = e);
const DAY = 864e5;
const INTERVAL = [0, 0, 2*DAY, 7*DAY, 21*DAY, 60*DAY]; // за боксом
const KEY = "katalog-ui-v1";
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- persistence ---------- */
let ST = {};
function load(){
  try{ ST = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ ST = {}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(ST)); }
  catch(e){ document.getElementById("storewarn") && (document.getElementById("storewarn").style.display="block"); }
}
function st(id){ return ST[id] || (ST[id] = {b:0, due:0, l:0, s:0}); }
const stateOf = b => b===0?0 : b<=2?1 : b<=4?2 : 3;
const STATE_NAMES = ["Нове","Вчу","Знаю","Засвоєно"];

/* ---------- сесія v2 ----------
   Три режими: нові поняття (відбір → вивчення), повторення, розрізнення.
   Повна специфікація — docs/learn-mode-v2.md
   Тип картки більше НЕ залежить від рівня: спосіб відповіді обирає користувач.
   Поле st().l лишається в структурі мертвим — заради сумісності експорту. */
let S = null;
const NEW_LEN = 5, REV_LEN = 10, PAIR_LEN = 8, TRIES = 3;

function dueList(){
  const now = Date.now();
  return DATA.filter(e => { const s = ST[e.id]; return s && s.b>0 && s.due<=now; })
             .sort((a,b) => ST[a.id].due - ST[b.id].due);
}
function newList(){ return DATA.filter(e => !ST[e.id] || ST[e.id].b===0); }

/* сусідні картки не з однієї категорії */
function interleave(items){
  for(let i=1;i<items.length;i++){
    if(items[i].c === items[i-1].c){
      const j = items.findIndex((x,k) => k>i && x.c!==items[i-1].c);
      if(j>-1){ const t=items[i]; items[i]=items[j]; items[j]=t; }
    }
  }
  return items;
}

/* ---------- клавіатурна перевірка ----------
   62 зі 160 термінів мають польську діакритику, 10 — це перелік через / або vs.
   Тому звіряємо нормалізовано, а перелік зараховуємо за будь-яким фрагментом. */
const DIA = {"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};
const norm = s => String(s||"").toLowerCase()
  .replace(/[ąćęłńóśźż]/g, c => DIA[c])
  .replace(/[.,;:!?]+$/g, "")
  .replace(/\s+/g, " ").trim();
function accepted(e){
  return e.pl.split(/\s*\/\s*|\s+vs\s+/i).map(norm).filter(Boolean).concat(norm(e.pl));
}
const checkTyped = (e, v) => { const t = norm(v); return !!t && accepted(e).indexOf(t) > -1; };

/* ---------- зміна стану ---------- */
function bump(e, ok){                    // ok = «запам'ятав / пам'ятаю»
  const s = st(e.id); s.s++;
  if(ok){ s.b = Math.min(5, s.b+1); s.due = Date.now() + INTERVAL[s.b]; }
  else  { s.b = 1; s.due = Date.now(); }
  save();
  ok ? S.right++ : S.wrong++;
}
function pickKnown(e){                   // «już to znam» на відборі → одразу в пул повторення
  const s = st(e.id); s.b = 4; s.s++; s.due = Date.now() + INTERVAL[4]; save();
}
function pickLearn(e){                   // «chcę się nauczyć» → у фазу вивчення
  const s = st(e.id); s.b = 1; s.due = Date.now(); save();
}

/* ---------- render: learn ---------- */
const vLearn = document.getElementById("v-learn");

function renderStart(){
  const d = dueList().length, n = newList().length;
  const learned = DATA.filter(e => (ST[e.id]||{}).b>=3).length;
  const pairs = PAIRS.filter(p => p.every(x => BY_ID[x])).length;
  vLearn.innerHTML = `
   <div class="startcard">
     <h2>Co dziś ćwiczymy?</h2>
     <p class="sub">${DATA.length} pojęć · ${learned} już znasz</p>
     <div class="l-modes">
       <button class="l-mode" id="m-new" ${n?"":"disabled"}>
         <span class="mt"><b>Nowe pojęcia</b><small>Najpierw wybierasz, czego chcesz się uczyć</small></span>
         <span class="mn">${Math.min(NEW_LEN,n)}</span></button>
       <button class="l-mode" id="m-rev" ${d?"":"disabled"}>
         <span class="mt"><b>Powtórka</b><small>${d?"Termin minął — czas sprawdzić":"Nic nie czeka na powtórkę"}</small></span>
         <span class="mn">${Math.min(REV_LEN,d)}</span></button>
       <button class="l-mode" id="m-pair">
         <span class="mt"><b>Co jest co?</b><small>Pojęcia, które najłatwiej pomylić · bez wpływu na postęp</small></span>
         <span class="mn">${Math.min(PAIR_LEN,pairs)}</span></button>
     </div>
     <div id="storewarn" style="display:none" class="hint2">⚠︎ Прогрес не зберігається — відкрий файл через http (GitHub Pages), а не як локальний файл.</div>
   </div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if(b && !b.disabled) b.onclick = fn; };
  on("m-new", startNew); on("m-rev", startRev); on("m-pair", startPair);
}

function startNew(){
  const pool = shuffle(newList().slice());
  S = {mode:"new", phase:"pick", pool, p:0, items:[], i:0,
       done:0, right:0, wrong:0, target:Math.min(NEW_LEN, pool.length)};
  renderCard();
}
function startRev(){
  const items = interleave(shuffle(dueList().slice(0, REV_LEN)));
  S = {mode:"rev", phase:"learn", items, i:0, done:0, right:0, wrong:0, target:items.length};
  renderCard();
}
function startPair(){
  const sets = shuffle(PAIRS.filter(p => p.every(x => BY_ID[x])).slice()).slice(0, PAIR_LEN);
  S = {mode:"pair", sets, i:0, right:0, wrong:0, target:sets.length};
  renderCard();
}

/* ---------- каркас картки ---------- */
function shell(inner, label, meta, doneN){
  const pct = Math.round(doneN / Math.max(1, S.target) * 100);
  return `<div class="sess">
    <div class="sessbar">
      <button class="x" id="quit" aria-label="Zakończ">✕</button>
      <div class="tr"><div class="fl" style="width:${pct}%"></div></div>
      <span class="n">${doneN}/${S.target}</span>
    </div>
    <div class="qcard l-swipe" id="card">
      <div class="qhead"><span class="qtype">${label}</span><span class="qbox">${meta}</span></div>
      ${inner}
    </div></div>`;
}
function actHTML(left, right){
  return `<div class="l-act">
    <button class="lft" id="actL">${left}</button><span class="sep"></span><button class="rgt" id="actR">${right}</button>
  </div>`;
}
function bindQuit(){ const q = document.getElementById("quit"); if(q) q.onclick = () => { S = null; renderStart(); }; }

/* свайп картки; кнопки внизу — індикатор напрямку, не дубль */
function armSwipe(onLeft, onRight){
  const card = document.getElementById("card");
  const aL = document.getElementById("actL"), aR = document.getElementById("actR");
  if(!card || !aL || !aR) return;
  aL.onclick = () => flyOut(card, -1, onLeft);
  aR.onclick = () => flyOut(card,  1, onRight);
  let x0 = 0, dx = 0, live = false;
  const TH = 78;
  card.style.touchAction = "pan-y";
  card.addEventListener("pointerdown", ev => {
    if(ev.target.closest("input, button, a")) return;
    x0 = ev.clientX; dx = 0; live = true;
    card.style.transition = "none";
    try { card.setPointerCapture(ev.pointerId); } catch(err){}
  });
  card.addEventListener("pointermove", ev => {
    if(!live) return;
    dx = ev.clientX - x0;
    card.style.transform = "translateX("+dx+"px) rotate("+(dx/45)+"deg)";
    aL.classList.toggle("arm", dx < -18);
    aR.classList.toggle("arm", dx >  18);
  });
  const end = () => {
    if(!live) return; live = false;
    card.style.transition = "transform .2s ease";
    if(dx <= -TH) flyOut(card, -1, onLeft);
    else if(dx >= TH) flyOut(card, 1, onRight);
    else { card.style.transform = ""; aL.classList.remove("arm"); aR.classList.remove("arm"); }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}
function flyOut(card, dir, cb){
  if(noMotion.matches){ cb(); return; }
  card.style.transition = "transform .19s ease, opacity .19s ease";
  card.style.transform = "translateX("+(dir*420)+"px) rotate("+(dir*11)+"deg)";
  card.style.opacity = "0";
  setTimeout(cb, 165);
}

/* те саме, що в каталозі: PL термін, опис, note, приклад фрази */
function revealHTML(e){
  return `<div class="l-reveal"><div class="l-revealbox" data-lang-id="${e.id}">
    <div class="l-revhead">
      <button class="pl" data-copy="${esc(e.pl).replace(/"/g,"&quot;")}"><span class="tagpl">PL</span><b>${esc(e.pl)}</b></button>
      ${langHTML()}
    </div>
    <div class="l-txt">${txtHTML(e)}</div>
  </div></div>`;
}

function renderCard(){
  if(S.mode === "pair") return cPair();
  if(S.mode === "new" && S.phase === "pick") return cPick();
  if(S.i >= S.items.length) return renderDone();
  return cLearn(S.items[S.i]);
}
function nextCard(){ S.i++; renderCard(); }

/* ---------- фаза 1: відбір ---------- */
function cPick(){
  if(S.items.length >= S.target || S.p >= S.pool.length){
    if(!S.items.length) return renderDone();
    S.phase = "learn"; S.i = 0; interleave(S.items); return renderCard();
  }
  const e = S.pool[S.p];
  vLearn.innerHTML = shell(`
    <div class="qstage">${e.d}</div>
    <div class="l-prompt"><div class="big">${esc(e.en)}</div>${e.alt?`<div class="alt">${esc(e.alt)}</div>`:""}</div>
    <div class="l-hint3">Znasz już to pojęcie?</div>
    ${actHTML("Już to znam", "Chcę się tego nauczyć")}`,
    "Wybór pojęć", "wybrano " + S.items.length + "/" + S.target, S.items.length);
  bindQuit();
  armSwipe(
    () => { pickKnown(e); S.p++; renderCard(); },
    () => { pickLearn(e); S.items.push(e); S.p++; renderCard(); }
  );
}

/* ---------- фаза 2 та повторення ---------- */
function cLearn(e){
  const box = st(e.id).b;
  const isRev = S.mode === "rev";
  const label = isRev ? "Powtórka" : "Nowe pojęcie";
  const meta  = isRev ? (box + ". powtórka") : ("poziom " + box + "/5");
  vLearn.innerHTML = shell(`
    <div class="qstage">${e.d}</div>
    <div class="l-prompt"><div class="big">${esc(e.en)}</div>${e.alt?`<div class="alt">${esc(e.alt)}</div>`:""}</div>
    <div class="l-hint3">Powiedz po polsku — potem sprawdź się.</div>
    <div class="l-ways" id="ways">
      <button class="l-way" id="w-eye">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.4 10-6.4S22 12 22 12s-3.6 6.4-10 6.4S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <span>Pokaż</span></button>
      <button class="l-way" id="w-kbd">
        <svg viewBox="0 0 24 24"><rect x="2.2" y="6" width="19.6" height="12" rx="2"/><path d="M6 9.6h.01M9.4 9.6h.01M12.8 9.6h.01M16.2 9.6h.01M18.6 9.6h.01M6 12.8h.01M9.4 12.8h.01M12.8 12.8h.01M16.2 12.8h.01M18.6 12.8h.01M8.4 15.6h7.2"/></svg>
        <span>Napisz</span></button>
    </div>`, label, meta, S.done);
  bindQuit();
  document.getElementById("w-eye").onclick = () => reveal(e, null);
  document.getElementById("w-kbd").onclick = () => typeMode(e);
}

/* самоперевірка: розкрити й оцінити себе */
function reveal(e, forced){
  const isRev = S.mode === "rev";
  const ways = document.getElementById("ways");
  const html = revealHTML(e) + (forced === null
    ? actHTML(isRev ? "Pamiętam" : "Zapamiętałem, odłóż", isRev ? "Nie pamiętam" : "Pokazuj dalej")
    : `<div class="l-opts"><button class="l-opt" id="nx" style="text-align:center">Dalej →</button></div>`);
  if(ways) ways.outerHTML = html; else document.getElementById("card").insertAdjacentHTML("beforeend", html);
  if(forced === null){
    armSwipe(() => finish(e, true), () => finish(e, false));
  } else {
    document.getElementById("nx").onclick = () => finish(e, forced);
  }
}

/* написати відповідь; три спроби, підказка по літері */
function typeMode(e){
  let left = TRIES, hinted = 0;
  const ways = document.getElementById("ways");
  ways.outerHTML = `
    <div class="l-type">
      <input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Wpisz polski termin…" aria-label="Polski termin">
      <button class="l-check" id="chk" aria-label="Sprawdź">✓</button>
    </div>
    <div class="l-typemeta">
      <button class="l-hintbtn" id="hint">Podpowiedz literę</button>
      <span id="tries">Pozostało prób: ${left}</span>
    </div>
    <div class="l-hint3" style="padding-top:12px">Ogonki nieobowiązkowe — <b>swiatlo</b> zaliczy się tak samo.</div>`;
  const inp = document.getElementById("ans");
  inp.focus();
  const done = ok => { inp.classList.add(ok?"ok":"no"); inp.disabled = true;
    document.getElementById("chk").disabled = true;
    document.getElementById("hint").disabled = true;
    if(!ok) inp.value = e.pl;
    reveal(e, ok); };
  const tryIt = () => {
    if(inp.disabled) return;
    if(checkTyped(e, inp.value)) return done(true);
    left--;
    document.getElementById("tries").textContent = "Pozostało prób: " + left;
    inp.classList.add("no");
    setTimeout(() => inp.classList.remove("no"), 450);
    if(left <= 0) done(false);
  };
  document.getElementById("chk").onclick = tryIt;
  inp.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); tryIt(); } });
  document.getElementById("hint").onclick = () => {
    hinted++;
    inp.value = e.pl.slice(0, hinted);
    inp.focus();
    if(hinted >= e.pl.length) document.getElementById("hint").disabled = true;
  };
}

function finish(e, ok){
  bump(e, ok);
  if(ok){ S.done++; nextCard(); }
  else {
    if(S.mode === "new"){ S.items.push(e); }   // «pokazuj dalej» — повертається в кінець сесії
    nextCard();
  }
}

/* ---------- розрізнення схожих ---------- */
function cPair(){
  if(S.i >= S.sets.length) return renderDone();
  const set = S.sets[S.i].map(id => BY_ID[id]);
  const e = set[Math.random()*set.length|0];
  const opts = shuffle(set.slice());
  vLearn.innerHTML = shell(`
    <div class="l-prompt"><div class="big">${esc(e.en)}</div>
      <div class="alt">${esc(e.pl)}</div></div>
    <div class="l-hint3">Który to? Te pojęcia najłatwiej pomylić.</div>
    <div class="l-opts two">${opts.map(o=>`<div class="l-optdemo" data-id="${o.id}"><div class="inner">${o.d}</div></div>`).join("")}</div>
    <div class="l-fbk" id="fbk"></div>`, "Co jest co?", "bez wpływu na postęp", S.i);
  bindQuit();
  const nodes = [].slice.call(vLearn.querySelectorAll(".l-optdemo"));
  nodes.forEach(n => n.onclick = () => {
    const ok = n.dataset.id === e.id;
    nodes.forEach(x => { x.onclick = null;
      if(x.dataset.id === e.id) x.classList.add("ok"); else if(x === n) x.classList.add("no"); });
    ok ? S.right++ : S.wrong++;
    document.getElementById("fbk").innerHTML =
      (ok ? "✓ Tak." : "✗ Nie.") + " " +
      opts.map(o => `<b>${esc(o.en)}</b> · <span class="pl-inline">${esc(o.pl)}</span> — ${strip(o.ua).split(".")[0]}.`).join("<br>") +
      `<div style="margin-top:11px"><button class="l-opt" id="nx" style="text-align:center;width:100%">Dalej →</button></div>`;
    document.getElementById("nx").onclick = () => { S.i++; renderCard(); };
  });
}

function renderDone(){
  const seen = S.right + S.wrong;
  const acc = seen ? Math.round(S.right/seen*100) : 100;
  const again = {new:"Jeszcze pięć pojęć", rev:"Jeszcze jedna powtórka", pair:"Jeszcze raz"}[S.mode];
  vLearn.innerHTML = `<div class="startcard"><div class="l-done">
     <div class="big">Gotowe</div>
     <p>${seen ? seen + " kart · " + acc + "% trafnych" : "Nic do zrobienia"}</p>
     <button class="bigbtn" id="again">${again}</button>
     <button class="bigbtn alt" id="back">Wróć</button>
   </div></div>`;
  document.getElementById("again").onclick = {new:startNew, rev:startRev, pair:startPair}[S.mode];
  document.getElementById("back").onclick = renderStart;
}


/* ---------- render: progress ---------- */
function renderProg(){
  const counts=[0,0,0,0];
  DATA.forEach(e => counts[stateOf((ST[e.id]||{}).b||0)]++);
  const cats = ORDER.map(k => {
    const items = DATA.filter(e => e.c===k), n = items.length;
    const c=[0,0,0,0]; items.forEach(e => c[stateOf((ST[e.id]||{}).b||0)]++);
    const known = c[2]+c[3];
    return {k, n, c, pct: Math.round(known/n*100)};
  });
  const weak = DATA.filter(e => (ST[e.id]||{}).l >= 2)
                   .sort((a,b)=>ST[b.id].l-ST[a.id].l).slice(0,12);
  document.getElementById("v-prog").innerHTML = `
    <div class="pgrid">
      ${counts.map((v,i)=>`<div class="pcell s${i}"><b>${v}</b><span>${STATE_NAMES[i]}</span></div>`).join("")}
    </div>
    <h3 class="pgsec">Za kategorią</h3>
    ${cats.map(c=>`<div class="catrow">
        <span class="nm">${CATS[c.k][0]}</span>
        <span class="tr">
          <span class="f3" style="width:${c.c[3]/c.n*100}%"></span>
          <span class="f2" style="width:${c.c[2]/c.n*100}%"></span>
          <span class="f1" style="width:${c.c[1]/c.n*100}%"></span>
        </span>
        <span class="pc">${c.pct}%</span>
      </div>`).join("")}
    <div class="weak"><h3>Słabe punkty</h3>
      ${weak.length ? weak.map(e=>`<div class="weakitem"><span style="color:var(--ink);font-family:var(--sans)">${esc(e.en)} · ${esc(e.pl)}</span><span>${ST[e.id].l}× błąd</span></div>`).join("")
        : '<div class="hint2">Поки порожньо. Тут з’являться елементи, які ти завалив 2+ рази.</div>'}
    </div>
    <div class="tools">
      <button id="exp">Eksportuj postęp (JSON)</button>
      <button id="imp">Importuj</button>
      <button id="rst" class="dg">Zresetuj</button>
      <input type="file" id="impf" accept="application/json" style="display:none">
    </div>
    <div class="hint2">Прогрес зберігається у цьому браузері. Експортуй файл перед зміною пристрою або чисткою кешу.</div>`;
  document.getElementById("exp").onclick = () => {

    a.href = URL.createObjectURL(blob);

    a.click();

  document.getElementById("imp").onclick = () => document.getElementById("impf").click();
  document.getElementById("impf").onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ ST = JSON.parse(r.result); save(); renderProg(); }catch(e){ alert("Nie udało się wczytać pliku."); } };
    r.readAsText(f);
  };
  document.getElementById("rst").onclick = () => {
    if(confirm("Скинути весь прогрес? Дію не можна скасувати.")){ ST={}; save(); renderProg(); }
  };
}

const out = document.getElementById("out");
document.getElementById("cats").innerHTML =
  ORDER.map((k,i)=>`<a class="cat" href="#s-${k}" data-k="${k}" data-sec="s-${k}">${String(i+1).padStart(2,"0")} · ${CATS[k][0]}</a>`).join("");

/* ---------- мова текстового блоку ----------
   Перемикається лише пояснення, note і приклад фрази.
   EN назва, PL термін і демо — це не переклади одне одного, а різні ролі,
   тому вони лишаються на місці завжди. Стан глобальний і зберігається. */
const LKEY = "katalog-ui-lang";
const LANGS = [["en","EN"],["pl","PL"],["ua","UA"]];
const EXLAB = {ua:"Як це звучить у команді", pl:"Jak to brzmi w zespole", en:"How it sounds on the team"};
const SOON  = {pl:"PL wkrótce", en:"EN soon", ua:""};
let LANG = "ua";
try { const v = localStorage.getItem(LKEY); if(v && EXLAB[v]) LANG = v; } catch(err){}

function txtOf(e){
  if(LANG === "ua") return {t:e.ua, note:e.note||"", ex:(e.ex&&e.ex.ua)||"", soon:false};
  const t = e.o && e.o[LANG], nt = e.nt && e.nt[LANG];
  return {t: t || e.ua, note: nt || e.note || "", ex:(e.ex&&e.ex[LANG])||"", soon: !t};
}
function txtHTML(e){
  const x = txtOf(e);
  return `<p class="ua">${x.t}${x.soon?`<span class="l-soon">${SOON[LANG]}</span>`:""}</p>
    ${x.note?`<p class="note">${x.note}</p>`:""}
    ${x.ex?`<div class="l-ex"><span class="l-exlab">${EXLAB[LANG]}</span><p>${x.ex}</p></div>`:""}`;
}
function langHTML(){
  return `<span class="l-lang" role="group" aria-label="Język opisu">${
    LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" class="${k===LANG?"on":""}" aria-pressed="${k===LANG}">${lab}</button>`).join("")
  }</span>`;
}
/* Оновлює КОЖЕН текстовий блок на сторінці — і картки каталогу, і розкриття
   в навчальному режимі. Ознака блока — атрибут data-lang-id з id запису. */
function setLang(l, keep){
  if(l === LANG || !EXLAB[l]) return;
  LANG = l;
  try { localStorage.setItem(LKEY, l); } catch(err){}
  const before = keep ? keep.getBoundingClientRect().top : 0;
  document.body.classList.remove("l-swap"); void document.body.offsetWidth;
  document.body.classList.add("l-swap");
  document.querySelectorAll("[data-lang-id]").forEach(host => {
    const e = BY_ID[host.dataset.langId], box = host.querySelector(".l-txt");
    if(e && box) box.innerHTML = txtHTML(e);
  });
  document.querySelectorAll(".l-lang button").forEach(x => {
    const on = x.dataset.l === LANG;
    x.classList.toggle("on", on); x.setAttribute("aria-pressed", on);
  });
  /* тексти різної довжини зсувають сторінку — тримаємо картку на місці */
  if(keep) window.scrollBy(0, keep.getBoundingClientRect().top - before);
}
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest(".l-lang button"); if(!b) return;
  setLang(b.dataset.l, b.closest(".entry"));
});

function entryHTML(e){
  const b = (ST[e.id]||{}).b||0, s = stateOf(b);
  return `<article class="entry" data-id="${e.id}" data-lang-id="${e.id}">
    <div class="entry-txt">
      <div class="l-head">
        <span class="code">${e.c}·${e.n} <span class="badge-state bs${s}">${STATE_NAMES[s]}</span></span>
        ${langHTML()}
      </div>
      <h3 class="en">${esc(e.en)}</h3>
      ${e.alt?`<p class="alt">${esc(e.alt)}</p>`:""}
      <button class="pl" data-copy="${esc(e.pl).replace(/"/g,"&quot;")}"><span class="tagpl">PL</span><b>${esc(e.pl)}</b></button>
      <div class="l-txt">${txtHTML(e)}</div>
    </div>
    <div class="sample">${e.d}</div>
  </article>`;
}
function renderCat(list){
  let html = "";
  ORDER.forEach((k,i)=>{
    const items = list.filter(e=>e.c===k); if(!items.length) return;
    html += `<section class="sec" id="s-${k}"><div class="sechead">
      <span class="secnum">${String(i+1).padStart(2,"0")}</span>
      <h2 class="sectitle">${CATS[k][0]}</h2><span class="secpl">${CATS[k][1]}</span></div>
      ${items.map(entryHTML).join("")}</section>`;
  });
  out.innerHTML = html || `<div class="empty">Nic nie znaleziono.</div>`;
  document.getElementById("count").textContent = list.length + " / " + DATA.length;
  const ind = document.getElementById("ind"); if(ind) ind.indeterminate = true;
  syncCats();
}

/* ---------- навігація по категоріях ----------
   Проблема, яку це лікує: пігулки живуть у липкій шапці, а якір #s-X
   стрибав миттєво зі статичним відступом 150px. Реальна шапка в режимі
   «Каталог» вища за 150px, тому заголовок секції ховався ПІД пігулками,
   а миттєвий стрибок давав мерехтіння перемальовки на iOS Safari. */
const catsNav = document.getElementById("cats");
const masthead = document.querySelector(".masthead");
const noMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function measureHead(){
  document.documentElement.style.setProperty("--mh", masthead.offsetHeight + "px");
}
measureHead();
window.addEventListener("resize", measureHead);
if(window.ResizeObserver) new ResizeObserver(measureHead).observe(masthead);

function headOffset(){ return masthead.offsetHeight + 12; }

/* пігулки без секції (після пошуку) гасимо, щоб клік не вів у нікуди */
function syncCats(){
  catsNav.querySelectorAll(".cat").forEach(a => {
    a.classList.toggle("l-off", !document.getElementById(a.dataset.sec));
  });
}

function goToCat(key){
  const sec = document.getElementById("s-" + key); if(!sec) return;
  const top = sec.getBoundingClientRect().top + window.pageYOffset - headOffset();
  const behavior = noMotion.matches ? "auto" : "smooth";
  try { window.scrollTo({top: Math.max(0, top), behavior}); }
  catch(err){ window.scrollTo(0, Math.max(0, top)); }
  sec.classList.remove("l-jump");
  void sec.offsetWidth;              // рестарт анімації підсвітки
  sec.classList.add("l-jump");
  history.replaceState(null, "", "#s-" + key);
  markCat(key);
}

function markCat(key){
  const pill = catsNav.querySelector('.cat[data-sec="s-' + key + '"]');
  catsNav.querySelectorAll(".cat").forEach(a => a.classList.toggle("on", a === pill));
  if(!pill) return;
  const left = pill.offsetLeft - (catsNav.clientWidth - pill.offsetWidth) / 2;
  try { catsNav.scrollTo({left: Math.max(0, left), behavior: noMotion.matches ? "auto" : "smooth"}); }
  catch(err){ catsNav.scrollLeft = Math.max(0, left); }
}

catsNav.addEventListener("click", ev => {
  const a = ev.target.closest(".cat"); if(!a) return;
  ev.preventDefault();
  goToCat(a.dataset.k);
});

/* підсвічуємо пігулку тієї секції, яку зараз видно */
let spyTick = 0;
window.addEventListener("scroll", () => {
  if(spyTick) return;
  spyTick = requestAnimationFrame(() => {
    spyTick = 0;
    if(!document.getElementById("v-cat").classList.contains("on")) return;
    const line = headOffset() + 20;
    let cur = null;
    out.querySelectorAll(".sec").forEach(s => {
      if(s.getBoundingClientRect().top <= line) cur = s.id.slice(2);
    });
    if(cur) markCat(cur);
  });
}, {passive: true});

document.getElementById("q").addEventListener("input", ev => {
  const v = ev.target.value.trim().toLowerCase();
  renderCat(v ? DATA.filter(e=>e.hay.includes(v)) : DATA);
});

/* copy PL term */

  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,done);
  else { const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a); a.select();
    try{document.execCommand("copy")}catch(e){} document.body.removeChild(a); done(); }
