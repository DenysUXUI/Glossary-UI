  <div style="font-size:10px;letter-spacing:.03em">Caption 12 — więcej światła</div>
 </div>`},
];

const CATS = {
  A:["Дії","Akcje"], B:["Поля вводу","Pola i formularze"], C:["Вибір і перемикання","Wybór"],
  D:["Навігація","Nawigacja"], E:["Контейнери","Kontenery"], F:["Оверлеї","Warstwy nakładane"],
  G:["Статус і фідбек","Komunikaty"], H:["Контент і дані","Treść i dane"],
  I:["E-commerce","Handel elektroniczny"], J:["Стани й анатомія","Stany i anatomia"],
  K:["Відступи й сітка","Odstępy i układ"], L:["Типографіка","Typografia"]
};
const ORDER = Object.keys(CATS);

/* пари, які найчастіше плутають — для карток рівня 5 */
const PAIRS = [
  ["F-06","F-05","F-07"], ["F-01","F-03","F-04"], ["F-01","F-02"],
  ["C-04","C-01"], ["C-01","C-03"], ["C-05","C-06","C-08"],
  ["A-05","A-04","D-05"], ["A-01","A-07"], ["A-02","A-03"],
  ["H-03","G-03","G-04"], ["G-01","G-02","F-10"], ["G-08","G-07","G-05"],
  ["G-05","G-11"], ["G-09","G-10"], ["E-06","E-07"], ["E-02","E-03"],
  ["C-11","D-11"], ["B-04","B-05","B-03"], ["D-03","D-04"], ["D-06","D-11"],
  ["K-01","K-02","K-03"], ["K-03","K-04"], ["K-06","K-07"],
  ["L-03","L-04","L-05"], ["L-01","L-02"], ["L-11","L-12"], ["J-07","K-18"]
];

/* ---------- helpers ---------- */
const strip = s => (s||"").replace(/<[^>]*>/g,"");
DATA.forEach(e => { e.id = e.c+"-"+e.n; e.hay = [e.en,e.alt,e.pl,strip(e.ua),strip(e.note),e.id].join(" ").toLowerCase(); });
const BY_ID = {}; DATA.forEach(e => BY_ID[e.id] = e);
const DAY = 864e5;
const INTERVAL = [0, 0, 2*DAY, 7*DAY, 21*DAY, 60*DAY]; // за боксом
const KEY = "katalog-ui-v1";
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- persistence ---------- */
let ST = {};
function load(){
  try{ ST = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ ST = {}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(ST)); }
  catch(e){ document.getElementById("storewarn") && (document.getElementById("storewarn").style.display="block"); }
}
function st(id){ return ST[id] || (ST[id] = {b:0, due:0, l:0, s:0}); }
const stateOf = b => b===0?0 : b<=2?1 : b<=4?2 : 3;
const STATE_NAMES = ["Нове","Вчу","Знаю","Засвоєно"];

/* ---------- session ---------- */
let S = null;

function dueList(){
  const now = Date.now();
  return DATA.filter(e => { const s = ST[e.id]; return s && s.b>0 && s.due<=now; })
             .sort((a,b) => ST[a.id].due - ST[b.id].due);
}
function newList(){ return DATA.filter(e => !ST[e.id] || ST[e.id].b===0); }

function buildSession(){
  const LEN = 12, MAXNEW = 5;
  const due = dueList().slice(0, LEN);
  const room = LEN - due.length;
  // якщо повторювати нема чого — наповнюємо сесію новими до повного розміру
  const fresh = newList().slice(0, due.length ? Math.min(MAXNEW, room) : room);
  let items = due.concat(fresh);
  if(!items.length) items = shuffle(DATA.slice()).slice(0, LEN); // все вивчено → вільне повторення
  shuffle(items);
  // інтерлівінг: не даємо двом сусіднім карткам бути з однієї категорії
  for(let i=1;i<items.length;i++){
    if(items[i].c === items[i-1].c){
      const j = items.findIndex((x,k) => k>i && x.c!==items[i-1].c);
      if(j>-1){ const t=items[i]; items[i]=items[j]; items[j]=t; }
    }
  }
  S = {items, i:0, right:0, wrong:0, total:items.length};
}

function cardType(box){
  if(box===0) return "intro";
  if(box===1) return "mc-name";
  if(box===2) return "mc-demo";
  if(box===3) return "recall";
  if(box===4) return "pl";
  return pairFor(S.items[S.i].id) ? "pair" : "recall";
}
function pairFor(id){
  const ps = PAIRS.filter(p => p.includes(id) && p.every(x => BY_ID[x]));
  return ps.length ? ps[Math.random()*ps.length|0] : null;
}
function distractors(e, n){
  const same = shuffle(DATA.filter(x => x.c===e.c && x.id!==e.id));
  const any  = shuffle(DATA.filter(x => x.c!==e.c));
  return same.slice(0,2).concat(any).slice(0,n);
}

/* ---------- grading ---------- */
function grade(e, ok, partial){
  const s = st(e.id); s.s++;
  if(partial){ s.due = Date.now() + DAY; }
  else if(ok){ s.b = Math.min(5, s.b+1); s.due = Date.now() + INTERVAL[s.b]; }
  else { s.b = 1; s.l++; s.due = Date.now(); }
  save();
  ok ? S.right++ : (partial ? 0 : S.wrong++);
}

/* ---------- render: learn ---------- */
const vLearn = document.getElementById("v-learn");

function renderStart(){
  const d = dueList().length, n = newList().length, learned = DATA.filter(e => (ST[e.id]||{}).b>=3).length;
  vLearn.innerHTML = `
   <div class="startcard">
     <h2>Sesja na 10 minut</h2>
     <p class="sub">12 карток. Система сама обере, що показати і в якій формі.</p>
     <div class="qstat">
       <div><b>${d}</b><span>do powtórki</span></div>
       <div><b>${n}</b><span>nowych</span></div>
       <div><b>${learned}</b><span>znasz</span></div>
     </div>
     <button class="bigbtn" id="go">Ćwicz →</button>
     <button class="bigbtn alt" id="goweak">Powtórz słabe punkty</button>
     <div id="storewarn" style="display:none" class="hint2">⚠︎ Прогрес не зберігається — відкрий файл через http (GitHub Pages), а не як локальний файл.</div>
   </div>`;
  document.getElementById("go").onclick = () => { buildSession(); renderCard(); };
  document.getElementById("goweak").onclick = () => {
    const weak = DATA.filter(e => (ST[e.id]||{}).l >= 2);
    if(!weak.length){ alert("Слабких місць поки немає — спочатку потренуйся."); return; }
    S = {items:shuffle(weak).slice(0,12), i:0, right:0, wrong:0, total:Math.min(12,weak.length)};
    renderCard();
  };
}

function shell(inner, typeLabel, box){
  const pct = Math.round(S.i / S.total * 100);
  return `<div class="sess">
    <div class="sessbar">
      <button class="x" id="quit" aria-label="Zakończ">✕</button>
      <div class="tr"><div class="fl" style="width:${pct}%"></div></div>
      <span class="n">${S.i+1}/${S.total}</span>
    </div>
    <div class="qcard">
      <div class="qhead"><span class="qtype">${typeLabel}</span><span class="qbox">poziom ${box}/5</span></div>
      ${inner}
    </div></div>`;
}

function renderCard(){
  if(S.i >= S.items.length) return renderDone();
  const e = S.items[S.i], box = st(e.id).b, t = cardType(box);
  if(t==="intro")   return cIntro(e, box);
  if(t==="mc-name") return cMcName(e, box);
  if(t==="mc-demo") return cMcDemo(e, box);
  if(t==="recall")  return cRecall(e, box);
  if(t==="pl")      return cPl(e, box);
  return cPair(e, box);
}
function bindQuit(){ const q=document.getElementById("quit"); if(q) q.onclick = () => { S=null; renderStart(); }; }
function next(){ S.i++; renderCard(); }

/* новий елемент — просто знайомство */
function cIntro(e, box){
  vLearn.innerHTML = shell(`
    <div class="qstage">${e.d}</div>
    <div class="l-reveal" style="padding-top:13px"><div class="l-revealbox">
      <div class="rn">${esc(e.en)}</div>
      <div class="rp">PL · ${esc(e.pl)}</div>
      <div class="rd">${e.ua}</div>
    </div></div>
    <div class="l-opts"><button class="l-opt" id="nx" style="text-align:center">Zrozumiałem →</button></div>`,
    "Nowe pojęcie", box);
  bindQuit();
  document.getElementById("nx").onclick = () => { const s=st(e.id); s.b=1; s.s++; s.due=Date.now(); save(); next(); };
}

/* демо → яка це назва */
function cMcName(e, box){
  const opts = shuffle([e].concat(distractors(e,3)));
  vLearn.innerHTML = shell(`
    <div class="qstage">${e.d}</div>
    <div class="qprompt"><div class="small">Jak nazywa się ten element?</div></div>
    <div class="l-opts">${opts.map(o=>`<button class="l-opt" data-id="${o.id}">${esc(o.en)}</button>`).join("")}</div>
    <div class="l-fbk" id="fbk"></div>`, "Rozpoznaj nazwę", box);
  bindQuit(); wireMc(e, opts);
}

/* назва → яке це демо */
function cMcDemo(e, box){
  const opts = shuffle([e].concat(distractors(e,3)));
  vLearn.innerHTML = shell(`
    <div class="qprompt"><div class="big">${esc(e.en)}</div><div class="small">${esc(e.pl)}</div></div>
    <div class="l-opts two">${opts.map(o=>`<div class="l-optdemo" data-id="${o.id}"><div class="inner">${o.d}</div></div>`).join("")}</div>
    <div class="l-fbk" id="fbk"></div>`, "Wskaż element", box);
  bindQuit(); wireMc(e, opts, ".l-optdemo");
}

function wireMc(e, opts, sel){
  sel = sel || ".l-opt";
  const nodes = [].slice.call(vLearn.querySelectorAll(sel));
  nodes.forEach(n => n.onclick = () => {
    const ok = n.dataset.id === e.id;
    nodes.forEach(x => { x.disabled = true; x.onclick = null;
      if(x.dataset.id === e.id) x.classList.add("ok");
      else if(x === n) x.classList.add("no"); });
    grade(e, ok);
    document.getElementById("fbk").innerHTML =
      `${ok ? "✓ Dobrze." : "✗ To jest <b>"+esc(e.en)+"</b>."} <span class="pl-inline">PL · ${esc(e.pl)}</span><br>${e.ua}
       <div style="margin-top:11px"><button class="l-opt" id="nx" style="text-align:center;width:100%">Dalej →</button></div>`;
    document.getElementById("nx").onclick = next;
  });
}

/* вільне пригадування із самооцінкою */
function cRecall(e, box){
  vLearn.innerHTML = shell(`
    <div class="qstage">${e.d}</div>
    <div class="qprompt"><div class="small">Przypomnij sobie nazwę — po angielsku i po polsku.</div></div>
    <div class="l-opts"><button class="l-opt" id="rev" style="text-align:center">Pokaż odpowiedź</button></div>`,
    "Przypomnij sobie", box);
  bindQuit();
  document.getElementById("rev").onclick = () => {
    vLearn.querySelector(".l-opts").outerHTML = `
      <div class="l-reveal"><div class="l-revealbox">
        <div class="rn">${esc(e.en)}</div><div class="rp">PL · ${esc(e.pl)}</div>
        <div class="rd">${e.ua}</div></div></div>
      <div class="l-grades">
        <button class="l-grade g1" data-g="0">Nie<small>od nowa</small></button>
        <button class="l-grade g2" data-g="1">Prawie<small>jutro</small></button>
        <button class="l-grade g3" data-g="2">Wiedziałem<small>dalej</small></button>
      </div>`;
    wireGrades(e);
  };
}

/* англійська → польська */
function cPl(e, box){
  vLearn.innerHTML = shell(`
    <div class="qprompt" style="padding:26px 14px 6px"><div class="big">${esc(e.en)}</div>
      <div class="small">Jak to powiesz po polsku?</div></div>
    <div class="l-opts"><button class="l-opt" id="rev" style="text-align:center">Pokaż odpowiedź</button></div>`,
    "Termin polski", box);
  bindQuit();
  document.getElementById("rev").onclick = () => {
    vLearn.querySelector(".l-opts").outerHTML = `
      <div class="l-reveal"><div class="l-revealbox">
        <div class="rp" style="font-size:17px">${esc(e.pl)}</div>
        ${e.note ? '<div class="rd">'+e.note+'</div>' : ''}</div></div>
      <div class="l-grades">
        <button class="l-grade g1" data-g="0">Nie<small>od nowa</small></button>
        <button class="l-grade g2" data-g="1">Prawie<small>jutro</small></button>
        <button class="l-grade g3" data-g="2">Wiedziałem<small>dalej</small></button>
      </div>`;
    wireGrades(e);
  };
}

function wireGrades(e){
  [].slice.call(vLearn.querySelectorAll(".l-grade")).forEach(b => b.onclick = () => {
    const g = +b.dataset.g;
    grade(e, g===2, g===1);
    next();
  });
}

/* розрізнення схожих */
function cPair(e, box){
  const pair = pairFor(e.id).map(id => BY_ID[id]);
  const opts = shuffle(pair.slice());
  vLearn.innerHTML = shell(`
    <div class="qprompt"><div class="big">${esc(e.en)}</div>
      <div class="small">Który to? Uważaj — te elementy łatwo pomylić.</div></div>
    <div class="l-opts two">${opts.map(o=>`<div class="l-optdemo" data-id="${o.id}"><div class="inner">${o.d}</div></div>`).join("")}</div>
    <div class="l-fbk" id="fbk"></div>`, "Odróżnij", box);
  bindQuit();
  const nodes = [].slice.call(vLearn.querySelectorAll(".l-optdemo"));
  nodes.forEach(n => n.onclick = () => {
    const ok = n.dataset.id === e.id;
    nodes.forEach(x => { x.onclick = null;
      if(x.dataset.id === e.id) x.classList.add("ok"); else if(x===n) x.classList.add("no"); });
    grade(e, ok);
    document.getElementById("fbk").innerHTML =
      (ok ? "✓ Tak." : "✗ Nie.") + " " + opts.map(o=>`<b>${esc(o.en)}</b> — ${strip(o.ua).split(".")[0]}.`).join("<br>") +
      `<div style="margin-top:11px"><button class="l-opt" id="nx" style="text-align:center;width:100%">Dalej →</button></div>`;
    document.getElementById("nx").onclick = next;
  });
}

function renderDone(){
  const acc = S.right + S.wrong ? Math.round(S.right/(S.right+S.wrong)*100) : 100;
  vLearn.innerHTML = `<div class="startcard"><div class="l-done">
     <div class="big">Sesja zakończona</div>
     <p>${S.total} kart · ${acc}% trafnych</p>
     <button class="bigbtn" id="again">Jeszcze jedna sesja</button>
     <button class="bigbtn alt" id="back">Wróć</button>
   </div></div>`;
  document.getElementById("again").onclick = () => { buildSession(); renderCard(); };
  document.getElementById("back").onclick = renderStart;
}

/* ---------- render: progress ---------- */
function renderProg(){
  const counts=[0,0,0,0];
  DATA.forEach(e => counts[stateOf((ST[e.id]||{}).b||0)]++);
  const cats = ORDER.map(k => {
    const items = DATA.filter(e => e.c===k), n = items.length;
    const c=[0,0,0,0]; items.forEach(e => c[stateOf((ST[e.id]||{}).b||0)]++);
    const known = c[2]+c[3];
    return {k, n, c, pct: Math.round(known/n*100)};
  });
  const weak = DATA.filter(e => (ST[e.id]||{}).l >= 2)
                   .sort((a,b)=>ST[b.id].l-ST[a.id].l).slice(0,12);
  document.getElementById("v-prog").innerHTML = `
    <div class="pgrid">
      ${counts.map((v,i)=>`<div class="pcell s${i}"><b>${v}</b><span>${STATE_NAMES[i]}</span></div>`).join("")}
    </div>
    <h3 class="pgsec">Za kategorią</h3>
    ${cats.map(c=>`<div class="catrow">
        <span class="nm">${CATS[c.k][0]}</span>
        <span class="tr">
          <span class="f3" style="width:${c.c[3]/c.n*100}%"></span>
          <span class="f2" style="width:${c.c[2]/c.n*100}%"></span>
          <span class="f1" style="width:${c.c[1]/c.n*100}%"></span>
        </span>
        <span class="pc">${c.pct}%</span>
      </div>`).join("")}
    <div class="weak"><h3>Słabe punkty</h3>
      ${weak.length ? weak.map(e=>`<div class="weakitem"><span style="color:var(--ink);font-family:var(--sans)">${esc(e.en)} · ${esc(e.pl)}</span><span>${ST[e.id].l}× błąd</span></div>`).join("")
        : '<div class="hint2">Поки порожньо. Тут з’являться елементи, які ти завалив 2+ рази.</div>'}
    </div>
    <div class="tools">
      <button id="exp">Eksportuj postęp (JSON)</button>
      <button id="imp">Importuj</button>
      <button id="rst" class="dg">Zresetuj</button>
      <input type="file" id="impf" accept="application/json" style="display:none">
    </div>
    <div class="hint2">Прогрес зберігається у цьому браузері. Експортуй файл перед зміною пристрою або чисткою кешу.</div>`;
  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(ST)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "katalog-ui-postep-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  };
  document.getElementById("imp").onclick = () => document.getElementById("impf").click();
  document.getElementById("impf").onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ ST = JSON.parse(r.result); save(); renderProg(); }catch(e){ alert("Nie udało się wczytać pliku."); } };
    r.readAsText(f);
  };
  document.getElementById("rst").onclick = () => {
    if(confirm("Скинути весь прогрес? Дію не можна скасувати.")){ ST={}; save(); renderProg(); }
  };
}

/* ---------- render: catalog ---------- */
const out = document.getElementById("out");
document.getElementById("cats").innerHTML =
  ORDER.map((k,i)=>`<a class="cat" href="#s-${k}">${String(i+1).padStart(2,"0")} · ${CATS[k][0]}</a>`).join("");

function entryHTML(e){
  const b = (ST[e.id]||{}).b||0, s = stateOf(b);
  return `<article class="entry" data-id="${e.id}">
    <div class="entry-txt">
      <span class="code">${e.c}·${e.n} <span class="badge-state bs${s}">${STATE_NAMES[s]}</span></span>
      <h3 class="en">${esc(e.en)}</h3>
      ${e.alt?`<p class="alt">${esc(e.alt)}</p>`:""}
      <button class="pl" data-copy="${esc(e.pl).replace(/"/g,"&quot;")}"><span class="tagpl">PL</span><b>${esc(e.pl)}</b></button>
      <p class="ua">${e.ua}</p>
      ${e.note?`<p class="note">${e.note}</p>`:""}
    </div>
    <div class="sample">${e.d}</div>
  </article>`;
}
function renderCat(list){
  let html = "";
  ORDER.forEach((k,i)=>{
    const items = list.filter(e=>e.c===k); if(!items.length) return;
    html += `<section class="sec" id="s-${k}"><div class="sechead">
      <span class="secnum">${String(i+1).padStart(2,"0")}</span>
      <h2 class="sectitle">${CATS[k][0]}</h2><span class="secpl">${CATS[k][1]}</span></div>
      ${items.map(entryHTML).join("")}</section>`;
  });
  out.innerHTML = html || `<div class="empty">Nic nie znaleziono.</div>`;
  document.getElementById("count").textContent = list.length + " / " + DATA.length;
  const ind = document.getElementById("ind"); if(ind) ind.indeterminate = true;
}
document.getElementById("q").addEventListener("input", ev => {
  const v = ev.target.value.trim().toLowerCase();
  renderCat(v ? DATA.filter(e=>e.hay.includes(v)) : DATA);
});

/* copy PL term */
const flash = document.getElementById("copied"); let ft;
document.addEventListener("click", ev => {
  const btn = ev.target.closest && ev.target.closest(".pl"); if(!btn) return;
  const txt = btn.dataset.copy;
  const done = () => { flash.textContent="skopiowano: "+txt; flash.classList.add("on");
    clearTimeout(ft); ft=setTimeout(()=>flash.classList.remove("on"),1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,done);
  else { const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a); a.select();
    try{document.execCommand("copy")}catch(e){} document.body.removeChild(a); done(); }
});

/* ---------- tabs ---------- */
const VIEWS = {learn:"v-learn", cat:"v-cat", prog:"v-prog"};
[].slice.call(document.querySelectorAll(".tabsnav button")).forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabsnav button").forEach(x=>x.classList.toggle("on", x===b));
  Object.values(VIEWS).forEach(id => document.getElementById(id).classList.remove("on"));
  document.getElementById(VIEWS[b.dataset.v]).classList.add("on");
  const isCat = b.dataset.v==="cat";
  document.getElementById("searchrow").style.display = isCat?"flex":"none";
  document.getElementById("cats").style.display = isCat?"flex":"none";
  if(isCat) renderCat(DATA);
  if(b.dataset.v==="prog") renderProg();
  if(b.dataset.v==="learn" && !S) renderStart();
  window.scrollTo(0,0);
});

load();
renderStart();
renderCat(DATA);
</script>
</body>
</html>
