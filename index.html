<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog UI — глосарій інтерфейсних елементів (EN · PL · UA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181A;
  --paper:#ECEEEA;
  --surface:#FFFFFF;
  --well:#F5F7F3;
  --line:#D2D7D1;
  --line-soft:#E3E7E2;
  --muted:#5C6660;
  --pcb:#0B5C43;
  --pcb-soft:#E4EFE9;
  --brass:#8A6516;
  --brass-soft:#F3EDDD;
  --danger:#A32B1C;
  --danger-soft:#FBE9E6;
  --warn:#8A5A00;
  --warn-soft:#FBF0DC;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--pcb)}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:50;
  background:var(--paper);border-bottom:1px solid var(--line);
}
.masthead-in{max-width:1180px;margin:0 auto;padding:14px 18px 12px}
.brandline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{
  font-family:var(--mono);font-weight:600;font-size:15px;
  letter-spacing:.14em;text-transform:uppercase;margin:0;
}
.brand em{font-style:normal;color:var(--pcb)}
.brandsub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.searchrow{display:flex;gap:8px;align-items:center;margin-top:11px}
.searchbox{position:relative;flex:1}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
#q{
  width:100%;padding:9px 12px 9px 32px;font:400 14px/1.2 var(--sans);
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);
}
#q::placeholder{color:#95A09A}
#q:focus{outline:2px solid var(--pcb);outline-offset:1px;border-color:var(--pcb)}
.count{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  white-space:nowrap;letter-spacing:.04em;
}
.cats{
  display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;
  scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  padding:5px 9px;border:1px solid var(--line);border-radius:99px;
  background:var(--surface);color:var(--muted);text-decoration:none;white-space:nowrap;
}
.cat:hover{border-color:var(--pcb);color:var(--pcb)}
.cat{transition:background-color .18s ease,border-color .18s ease,color .18s ease}
.cat.on{background:var(--pcb);border-color:var(--pcb);color:#fff}
.cat.l-off{opacity:.32;pointer-events:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
/* --mh = реальна висота липкої шапки, рахується в JS */
.sec{margin:0 0 34px;scroll-margin-top:calc(var(--mh,150px) + 12px)}
.sechead{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:7px;border-bottom:1.5px solid var(--ink);margin-bottom:14px;
  border-radius:2px 2px 0 0;
}
/* коротка підсвітка заголовка після переходу — щоб око знайшло ціль */
.sec.l-jump .sechead{animation:l-jump-hi .85s ease-out}
@keyframes l-jump-hi{
  0%{background:var(--pcb-soft);box-shadow:0 0 0 6px var(--pcb-soft)}
  100%{background:transparent;box-shadow:0 0 0 6px transparent}
}
.secnum{font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:.08em}
.sectitle{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0}
.secpl{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;letter-spacing:.04em}

/* ---------- entry ---------- */
.entry{
  display:grid;grid-template-columns:1fr;gap:0;
  background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;
}
@media(min-width:820px){
  .entry{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
}
.entry-txt{padding:14px 16px 15px;min-width:0}
.code{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--brass);display:block;margin-bottom:5px;
}
.en{font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.alt{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 8px}
.pl{
  display:inline-flex;align-items:center;gap:7px;margin:0 0 9px;
  font-family:var(--mono);font-size:13px;color:var(--pcb);
  background:var(--pcb-soft);border:1px solid #C6DED4;
  padding:3px 8px;border-radius:var(--r);cursor:pointer;
  text-align:left;
}
.pl:hover{background:#D7E9E0}
.pl b{font-weight:600}
.pl .tagpl{
  font-size:9px;letter-spacing:.1em;color:#fff;background:var(--pcb);
  padding:1px 4px;border-radius:2px;flex:0 0 auto;
}
.ua{margin:0;font-size:14.5px}
.note{
  margin:9px 0 0;font-size:12.5px;color:var(--muted);
  border-left:2px solid var(--brass);padding-left:9px;
}
.note b{color:var(--ink);font-weight:600}

/* мова текстового блоку — сегмент-контрол у шапці картки.
   Стан глобальний: клік на будь-якій картці перемикає весь каталог. */
.l-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.l-head .code{margin-bottom:0;flex:1 1 auto;min-width:0}
.l-lang{
  display:inline-flex;flex:0 0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.l-lang button{
  font:500 9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;border:0;background:transparent;color:var(--muted);cursor:pointer;
  transition:background-color .16s ease,color .16s ease;
}
.l-lang button + button{border-left:1px solid var(--line)}
.l-lang button:hover{color:var(--pcb)}
.l-lang button.on,.l-lang button.on:hover{background:var(--pcb);color:#fff}

/* приклад фрази з робочої розмови */
.l-ex{
  margin:10px 0 0;padding:8px 10px;
  background:var(--well);border:1px dashed var(--line);border-radius:var(--r);
}
.l-exlab{
  display:block;font:500 9px var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);margin-bottom:3px;
}
.l-ex p{margin:0;font-size:13.5px;font-style:italic}
.l-ex b{font-style:normal;font-weight:600;color:var(--pcb)}

body.l-swap .l-txt{animation:l-fade .22s ease}
@keyframes l-fade{from{opacity:.3}to{opacity:1}}

/* позначка «цією мовою ще нема, показано UA» */
.l-soon{
  display:inline-block;margin-left:6px;padding:0 4px;vertical-align:1px;
  font:400 9.5px var(--mono);letter-spacing:.08em;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;
}

/* ---------- sample well ---------- */
.sample{
  border-top:1px solid var(--line-soft);
  background:var(--well);
  background-image:radial-gradient(var(--line) .9px,transparent .9px);
  background-size:11px 11px;background-position:-1px -1px;
  padding:20px 16px;display:flex;align-items:center;justify-content:center;
  min-height:120px;
}
@media(min-width:820px){
  .sample{border-top:0;border-left:1px solid var(--line-soft)}
}
.sample>*{max-width:100%}
.empty{padding:36px 18px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px}

/* ---------- toast on copy ---------- */
#copied{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;
  padding:8px 14px;border-radius:var(--r);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:99;
}
#copied.on{opacity:1;transform:translate(-50%,0)}

/* ================= DEMO PRIMITIVES ================= */
.d{font-family:var(--sans);font-size:13px;color:var(--ink)}
.ic{width:15px;height:15px;display:inline-block;vertical-align:-2.5px;flex:0 0 auto}
.b .ic,.rail .ic,.bnav .ic{pointer-events:none}
.rail .ic,.bnav .ic{width:16px;height:16px;display:block;margin:0 auto 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:8px;width:100%;max-width:270px}
.cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

/* buttons */
.b{
  font:500 13px/1 var(--sans);padding:9px 14px;border-radius:var(--r);
  border:1px solid transparent;cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;
}
.b-p{background:var(--pcb);color:#fff}
.b-p:hover{background:#0A4E39}
.b-s{background:var(--surface);color:var(--ink);border-color:var(--line)}
.b-s:hover{border-color:var(--ink)}
.b-t{background:transparent;color:var(--pcb);padding-left:6px;padding-right:6px}
.b-t:hover{background:var(--pcb-soft)}
.b-d{background:var(--danger);color:#fff}
.b[disabled]{opacity:.42;cursor:not-allowed}
.b-i{padding:8px;border-radius:var(--r)}
.b:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fab{
  width:44px;height:44px;border-radius:14px;background:var(--pcb);color:#fff;
  border:0;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 9px rgba(11,92,67,.32);
}
.bgroup{display:inline-flex}
.bgroup .b{border-radius:0;border-color:var(--line);background:var(--surface);color:var(--ink)}
.bgroup .b:first-child{border-radius:var(--r) 0 0 var(--r)}
.bgroup .b:last-child{border-radius:0 var(--r) var(--r) 0;margin-left:-1px}
.bgroup .b:not(:first-child):not(:last-child){margin-left:-1px}
.split{display:inline-flex}
.split .b:first-child{border-radius:var(--r) 0 0 var(--r)}
.split .b:last-child{border-radius:0 var(--r) var(--r) 0;border-left:1px solid rgba(255,255,255,.3);padding:9px 8px}
.lnk{color:var(--pcb);text-decoration:underline;text-underline-offset:2.5px;cursor:pointer}

/* inputs */
.in,.ta,.sel{
  width:100%;font:400 13px/1.3 var(--sans);color:var(--ink);
  padding:8px 10px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
}
.in:focus,.ta:focus,.sel:focus{outline:2px solid var(--pcb);outline-offset:0;border-color:var(--pcb)}
.ta{resize:none;height:62px}
.lab{font-size:12px;font-weight:600;display:block;margin-bottom:4px}
.lab .req{color:var(--danger)}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.err{font-size:11.5px;color:var(--danger);margin-top:4px;display:flex;gap:5px;align-items:center}
.in.bad{border-color:var(--danger);background:var(--danger-soft)}
.in.bad:focus{outline-color:var(--danger)}
.affix{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.affix span{
  background:var(--well);padding:8px 10px;font-family:var(--mono);font-size:12px;
  color:var(--muted);display:grid;place-items:center;
}
.affix span:first-child{border-right:1px solid var(--line)}
.affix span:last-child{border-left:1px solid var(--line)}
.affix .in{border:0;border-radius:0}
.affix .in:focus{outline-offset:-2px}
.otp{display:flex;gap:6px}
.otp i{
  width:32px;height:38px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);display:grid;place-items:center;
  font:500 15px/1 var(--mono);font-style:normal;
}
.otp i.act{border-color:var(--pcb);outline:2px solid var(--pcb-soft)}
.drop{
  border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);
  padding:16px;text-align:center;width:100%;max-width:250px;
}
.drop b{display:block;font-size:12.5px}
.drop small{color:var(--muted);font-size:11px}
.counter{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* choice controls */
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--pcb);width:15px;height:15px;margin:2px 0 0;flex:0 0 auto}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{
  width:36px;height:20px;border-radius:99px;background:#BFC7C1;position:relative;
  transition:background .16s;flex:0 0 auto;
}
.sw i::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:transform .16s;
  box-shadow:0 1px 2px rgba(0,0,0,.22);
}
.sw input:checked + i{background:var(--pcb)}
.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{accent-color:var(--pcb);width:100%}
.dual{position:relative;height:26px;width:100%;max-width:230px}
.dual .trk{position:absolute;top:11px;left:0;right:0;height:4px;background:#CBD3CD;border-radius:9px}
.dual .fil{position:absolute;top:11px;left:26%;right:22%;height:4px;background:var(--pcb);border-radius:9px}
.dual b{
  position:absolute;top:6px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid var(--pcb);
}
.stp{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stp button{width:32px;border:0;background:transparent;font-size:15px;cursor:pointer;color:var(--ink)}
.stp button:hover{background:var(--well)}
.stp input{width:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:500 13px var(--mono);padding:8px 0}
.stp input:focus{outline:2px solid var(--pcb);outline-offset:-2px}
.stars{display:flex;gap:2px;color:var(--brass);font-size:17px;letter-spacing:1px}
.stars .off{color:#C9D0CA}
.swatch{display:flex;gap:6px;align-items:center}
.swatch b{width:26px;height:26px;border-radius:var(--r);border:1px solid rgba(0,0,0,.14);display:block}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px;width:196px}
.cal-h{display:flex;justify-content:space-between;align-items:center;font:600 11.5px var(--sans);margin-bottom:6px}
.cal-h span{font-family:var(--mono);color:var(--muted);cursor:pointer}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-g div{font-size:10.5px;padding:3.5px 0;border-radius:2px}
.cal-g .dow{color:var(--muted);font-family:var(--mono);font-size:9px}
.cal-g .mut{color:#B4BCB6}
.cal-g .sel{background:var(--pcb);color:#fff;font-weight:600}
.cal-g .rng{background:var(--pcb-soft)}

/* navigation */
.crumb{display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap;color:var(--muted)}
.crumb a{color:var(--pcb);text-decoration:none}
.crumb b{color:var(--ink);font-weight:600}
.pag{display:flex;gap:4px;align-items:center}
.pag a{
  min-width:29px;height:29px;display:grid;place-items:center;font:500 12px var(--mono);
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  color:var(--ink);text-decoration:none;padding:0 6px;
}
.pag a.on{background:var(--pcb);border-color:var(--pcb);color:#fff}
.pag span{color:var(--muted);padding:0 2px}
.tabs{width:100%;max-width:270px}
.tabs input{position:absolute;opacity:0;pointer-events:none}
.tabs .tl{display:flex;border-bottom:1px solid var(--line)}
.tabs .tl label{
  padding:8px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs .tp{padding:11px 2px;font-size:12.5px;display:none;color:var(--muted)}
.tabs #t1:checked~.tl label[for=t1],
.tabs #t2:checked~.tl label[for=t2],
.tabs #t3:checked~.tl label[for=t3]{color:var(--pcb);border-bottom-color:var(--pcb);font-weight:600}
.tabs #t1:checked~.p1,.tabs #t2:checked~.p2,.tabs #t3:checked~.p3{display:block}
.menu{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 6px 18px rgba(20,24,26,.11);padding:4px;width:170px;
}
.menu a{
  display:flex;justify-content:space-between;gap:10px;padding:6px 8px;font-size:12.5px;
  color:var(--ink);text-decoration:none;border-radius:2px;
}
.menu a:hover{background:var(--well)}
.menu a kbd{font-family:var(--mono);font-size:10px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px 0}
.menu .dg{color:var(--danger)}
.rail{
  display:flex;flex-direction:column;gap:2px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:6px;width:66px;text-align:center;
}
.rail div{padding:6px 0;font-size:9px;font-family:var(--mono);color:var(--muted);border-radius:2px}
.rail div.on{background:var(--pcb-soft);color:var(--pcb)}
.rail div b{display:block;font-size:15px;font-family:var(--sans);margin-bottom:1px}
.bnav{
  display:flex;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);width:100%;max-width:240px;
}
.bnav div{flex:1;text-align:center;padding:7px 0;font-size:9px;font-family:var(--mono);color:var(--muted)}
.bnav div b{display:block;font-size:15px;font-family:var(--sans)}
.bnav div.on{color:var(--pcb)}
.steps{display:flex;align-items:center;gap:0;width:100%;max-width:260px}
.steps .s{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.steps .s b{
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  font:500 11px var(--mono);border:1.5px solid var(--line);background:var(--surface);color:var(--muted);
}
.steps .s.done b{background:var(--pcb);border-color:var(--pcb);color:#fff}
.steps .s.now b{border-color:var(--pcb);color:var(--pcb)}
.steps .s span{font-size:9.5px;font-family:var(--mono);color:var(--muted)}
.steps .ln{flex:1;height:1.5px;background:var(--line);margin:0 4px 15px}
.steps .ln.done{background:var(--pcb)}
.cmdk{background:var(--surface);border:1px solid var(--line);border-radius:5px;width:100%;max-width:250px;box-shadow:0 8px 22px rgba(20,24,26,.13);overflow:hidden}
.cmdk .q{padding:9px 11px;border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);display:flex;gap:7px}
.cmdk .g{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);padding:7px 11px 3px}
.cmdk .it{padding:6px 11px;font-size:12.5px;display:flex;justify-content:space-between}
.cmdk .it.on{background:var(--pcb-soft)}
.tbar{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tbar button{border:0;background:transparent;padding:7px 9px;cursor:pointer;font:500 13px var(--sans);color:var(--muted)}
.tbar button.on{background:var(--well);color:var(--pcb)}
.tbar .sp{width:1px;background:var(--line);margin:5px 2px}
.skip{background:var(--pcb);color:#fff;font-size:12px;padding:6px 11px;border-radius:var(--r)}

/* containment */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  width:100%;max-width:230px;overflow:hidden;
}
.card .ph{height:66px;background:linear-gradient(115deg,#DDE4DE,#EDF1EC)}
.card .bd{padding:10px 11px}
.card h4{margin:0 0 3px;font-size:13.5px}
.card p{margin:0 0 9px;font-size:11.5px;color:var(--muted);line-height:1.45}
details.acc{width:100%;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.acc+details.acc{margin-top:-1px}
details.acc summary{
  padding:9px 11px;font-size:12.5px;font-weight:600;cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;gap:8px;
}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-family:var(--mono);color:var(--pcb)}
details.acc[open] summary::after{content:"–"}
details.acc p{margin:0;padding:0 11px 11px;font-size:12px;color:var(--muted)}
.divi{width:100%;max-width:240px}
.divi hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.divi .lbl{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10.5px;font-family:var(--mono)}
.divi .lbl::before,.divi .lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.lst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:250px}
.lst div{padding:8px 11px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.lst div+div{border-top:1px solid var(--line-soft)}
.lst small{color:var(--muted);font-family:var(--mono);font-size:11px}
table.t{
  border-collapse:collapse;background:var(--surface);font-size:11.5px;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
table.t th{
  background:var(--well);font:600 9.5px/1 var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);padding:7px 9px;text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
table.t td{padding:6px 9px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.n{font-family:var(--mono);text-align:right}
.tree{font-size:12.5px;width:100%;max-width:220px}
.tree details{margin-left:12px}
.tree>details{margin-left:0}
.tree summary{cursor:pointer;padding:2.5px 0;list-style:none;color:var(--ink)}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--pcb);margin-right:6px;font-size:10px;display:inline-block}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree i{display:block;padding:2.5px 0 2.5px 26px;color:var(--muted);font-style:normal}
.scr{
  height:96px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 11px;font-size:12px;width:100%;max-width:230px;color:var(--muted);
}
.split2{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:250px;height:88px;overflow:hidden}
.split2 .p1{width:38%;background:var(--well);padding:9px;font-size:11px;color:var(--muted)}
.split2 .hnd{width:5px;background:var(--line-soft);cursor:col-resize;display:grid;place-items:center}
.split2 .hnd::after{content:"";width:1px;height:18px;background:var(--muted)}
.split2 .p2{flex:1;padding:9px;font-size:11px;color:var(--muted)}

/* scene = mini viewport for overlays */
.scene{
  position:relative;width:100%;max-width:236px;height:148px;background:var(--surface);
  border:1px solid var(--line);border-radius:5px;overflow:hidden;
}
.scene .pg{padding:9px}
.scene .pg .bar{height:7px;background:var(--line-soft);border-radius:9px;margin-bottom:6px}
.scene .pg .bar.s{width:56%}
.scene .pg .bar.m{width:78%}
.scrim{position:absolute;inset:0;background:rgba(20,24,26,.42)}
.dlg{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:83%;background:var(--surface);border-radius:5px;padding:11px;
  box-shadow:0 10px 26px rgba(0,0,0,.26);
}
.dlg h5{margin:0 0 4px;font-size:12.5px}
.dlg p{margin:0 0 10px;font-size:11px;color:var(--muted);line-height:1.4}
.dlg .act{display:flex;gap:6px;justify-content:flex-end}
.dlg .b{padding:6px 10px;font-size:11.5px}
.drw{
  position:absolute;top:0;right:0;bottom:0;width:62%;background:var(--surface);
  box-shadow:-6px 0 18px rgba(0,0,0,.18);padding:11px;
}
.drw h5{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:11px 11px 0 0;padding:9px 11px 13px;box-shadow:0 -6px 18px rgba(0,0,0,.16);
}
.sheet .grab{width:32px;height:3.5px;border-radius:9px;background:var(--line);margin:0 auto 9px}
.pop{
  position:absolute;left:14px;top:52px;width:72%;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px;
  box-shadow:0 7px 18px rgba(0,0,0,.15);font-size:11px;color:var(--muted);
}
.pop::before{
  content:"";position:absolute;top:-5px;left:16px;width:8px;height:8px;
  background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);
  transform:rotate(45deg);
}
.lb{position:absolute;inset:0;background:rgba(20,24,26,.78);display:grid;place-items:center}
.lb .im{width:64%;height:60%;background:linear-gradient(115deg,#5C6660,#8E9A93);border-radius:3px}
.lb .x{position:absolute;top:7px;right:9px;color:#fff;font-size:14px}

/* tooltip (live) */
.tipw{position:relative;display:inline-block}
.tipw .trg{
  border-bottom:1.5px dotted var(--muted);cursor:help;font-size:13px;
}
.tip{
  position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:11px;padding:5px 9px;border-radius:3px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .13s;
}
.tip::after{
  content:"";position:absolute;top:100%;left:50%;margin-left:-4px;
  border:4px solid transparent;border-top-color:var(--ink);
}
.tipw:hover .tip,.tipw:focus-within .tip,.tipw:active .tip{opacity:1}
@media (hover:none){.sample .tip,.qstage .tip{opacity:1;position:static;transform:none;display:inline-block;margin-left:9px;white-space:normal}.sample .tip::after,.qstage .tip::after{display:none}}
.hcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:10px;width:190px;box-shadow:0 7px 18px rgba(0,0,0,.12);
}
.hcard .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.hcard p{margin:0;font-size:11px;color:var(--muted);line-height:1.42}

/* feedback */
.toast{
  display:flex;gap:9px;align-items:center;background:var(--ink);color:#fff;
  padding:9px 12px;border-radius:var(--r);font-size:12.5px;max-width:250px;
}
.toast .un{margin-left:auto;color:#8FD3BB;font-weight:600;font-size:11.5px;cursor:pointer}
.al{
  display:flex;gap:9px;padding:9px 11px;border-radius:var(--r);font-size:12px;
  width:100%;max-width:250px;line-height:1.42;border:1px solid;
}
.al b{display:block;font-size:12.5px;margin-bottom:1px}
.al-i{background:var(--pcb-soft);border-color:#C6DED4;color:#0A4433}
.al-w{background:var(--warn-soft);border-color:#EBD9B4;color:#6B4700}
.al-e{background:var(--danger-soft);border-color:#F1CDC7;color:#842317}
.bnr{
  display:flex;gap:9px;align-items:center;background:var(--ink);color:#fff;
  padding:8px 11px;font-size:12px;width:100%;max-width:255px;border-radius:var(--r);
}
.bnr .x{margin-left:auto;opacity:.6}
.badge{
  display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;
  border-radius:99px;background:var(--danger);color:#fff;font:600 10px/1 var(--mono);
}
.badge.dot{min-width:8px;width:8px;height:8px;padding:0}
.bwrap{position:relative;display:inline-flex}
.bwrap .badge{position:absolute;top:-5px;right:-7px;border:1.5px solid var(--well)}
.pill{
  display:inline-flex;gap:5px;align-items:center;font:500 11px var(--sans);
  padding:3px 8px;border-radius:99px;border:1px solid;
}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
.pill.ok{background:var(--pcb-soft);border-color:#C6DED4;color:#0A4433}
.pill.wr{background:var(--warn-soft);border-color:#EBD9B4;color:#6B4700}
.pill.no{background:var(--danger-soft);border-color:#F1CDC7;color:#842317}
.prog{width:100%;max-width:230px}
.prog .tr{height:6px;background:#D8DED9;border-radius:9px;overflow:hidden}
.prog .fl{height:100%;background:var(--pcb);border-radius:9px;width:64%}
.prog .mt{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--muted);margin-top:5px}
.prog.ind .fl{width:38%;animation:sl 1.5s ease-in-out infinite}
@keyframes sl{0%{margin-left:-38%}100%{margin-left:100%}}
.spin{
  width:22px;height:22px;border:2.5px solid #D2DAD5;border-top-color:var(--pcb);
  border-radius:50%;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.dots span{
  display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--pcb);
  margin:0 1.5px;animation:bo 1.1s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
@keyframes bo{0%,80%,100%{opacity:.28}40%{opacity:1}}
.skel{width:100%;max-width:240px}
.skel div{
  height:9px;border-radius:3px;margin-bottom:7px;
  background:linear-gradient(90deg,#E1E6E1 25%,#EFF3EE 37%,#E1E6E1 63%);
  background-size:400% 100%;animation:sh 1.35s ease infinite;
}
.skel div.t{height:44px}
.skel div.w6{width:62%}
.skel div.w8{width:82%;margin-bottom:0}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.mty{text-align:center;max-width:220px}
.mty .ic{
  width:38px;height:38px;border:1.5px dashed var(--line);border-radius:var(--r);
  margin:0 auto 9px;display:grid;place-items:center;color:var(--muted);
}
.mty b{display:block;font-size:12.5px;margin-bottom:3px}
.mty p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.42}
.err404{text-align:center}
.err404 b{font:600 30px/1 var(--mono);color:var(--pcb);display:block}
.err404 p{margin:6px 0 0;font-size:11.5px;color:var(--muted)}
.gauge{text-align:center}
.gauge .tr{width:120px;height:7px;background:linear-gradient(90deg,var(--pcb) 0 40%,var(--warn) 40% 72%,var(--danger) 72% 100%);border-radius:9px;position:relative}
.gauge .nd{position:absolute;top:-4px;left:56%;width:2.5px;height:15px;background:var(--ink);border-radius:2px}
.gauge small{display:block;font:500 10.5px var(--mono);color:var(--muted);margin-top:7px}

/* content */
.av{
  width:32px;height:32px;border-radius:50%;background:var(--pcb);color:#fff;
  display:grid;place-items:center;font:600 12px var(--sans);flex:0 0 auto;
}
.av.sq{border-radius:var(--r)}
.av.br{background:var(--brass)}
.av.gr{background:#5C6660}
.avg{display:flex}
.avg .av{border:2px solid var(--well);margin-left:-9px}
.avg .av:first-child{margin-left:0}
.avg .more{background:var(--line);color:var(--muted)}
.chip{
  display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:4px 9px;
  border-radius:99px;background:var(--surface);border:1px solid var(--line);
}
.chip.on{background:var(--pcb);border-color:var(--pcb);color:#fff}
.chip .x{opacity:.55;cursor:pointer;font-size:13px;line-height:1}
.thumb{width:52px;height:52px;border-radius:var(--r);background:linear-gradient(115deg,#DDE4DE,#EDF1EC);border:1px solid var(--line)}
.carou{width:100%;max-width:240px}
.carou .fr{display:flex;gap:7px;overflow:hidden}
.carou .fr div{
  flex:0 0 44%;height:60px;border-radius:var(--r);
  background:linear-gradient(115deg,#DDE4DE,#EDF1EC);border:1px solid var(--line);
}
.carou .dt{display:flex;gap:5px;justify-content:center;margin-top:9px}
.carou .dt i{width:5px;height:5px;border-radius:50%;background:#C4CCC6}
.carou .dt i.on{background:var(--pcb);width:14px;border-radius:9px}
.chart{display:flex;align-items:flex-end;gap:5px;height:66px}
.chart b{width:15px;background:var(--pcb);border-radius:2px 2px 0 0;display:block;opacity:.85}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:132px}
.stat .k{font:500 9.5px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stat .v{font:600 22px/1.1 var(--sans);margin:4px 0 2px}
.stat .d{font-size:11px;color:var(--pcb);font-weight:500}
.tml{border-left:1.5px solid var(--line);padding-left:14px;font-size:12px;max-width:220px}
.tml div{position:relative;padding-bottom:11px}
.tml div:last-child{padding-bottom:0}
.tml div::before{
  content:"";position:absolute;left:-19.5px;top:4px;width:8px;height:8px;
  border-radius:50%;background:var(--surface);border:1.5px solid var(--line);
}
.tml div.on::before{background:var(--pcb);border-color:var(--pcb)}
.tml small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted)}
kbd.k{
  font:500 11px var(--mono);background:var(--surface);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:2.5px 6px;
}
pre.code2{
  background:var(--ink);color:#D8E4DE;font:400 11px/1.6 var(--mono);
  padding:10px 12px;border-radius:var(--r);margin:0;overflow:auto;max-width:250px;
}
pre.code2 .c{color:#7E9A8E}
pre.code2 .s{color:#D9B980}
.trunc{width:100%;max-width:220px;font-size:12.5px}
.trunc .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px}
.trunc .two{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;margin-top:7px;color:var(--muted);font-size:11.5px;
}

/* e-commerce */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:186px;padding:10px}
.pcard .im{height:56px;background:linear-gradient(115deg,#DDE4DE,#EDF1EC);border-radius:2px;margin-bottom:8px}
.pcard .sym{font:500 10px var(--mono);color:var(--muted)}
.pcard h4{margin:2px 0 5px;font-size:12px;line-height:1.3}
.pcard .pr{font:600 14px var(--sans)}
.pcard .pr s{font:400 10.5px var(--mono);color:var(--muted);margin-left:5px}
.ptable{border-collapse:collapse;font-size:11px;background:var(--surface);border:1px solid var(--line)}
.ptable td{padding:4px 9px;border-bottom:1px solid var(--line-soft);font-family:var(--mono)}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.on td{background:var(--pcb-soft);color:var(--pcb);font-weight:600}
.facet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;width:100%;max-width:190px;font-size:12px}
.facet .ft{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.facet label{display:flex;gap:7px;align-items:center;padding:2.5px 0;cursor:pointer}
.facet label span{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.facet input{accent-color:var(--pcb);width:14px;height:14px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:220px;padding:10px}
.mini .li{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:11.5px}
.mini .li+.li{border-top:1px solid var(--line-soft)}
.mini .th{width:26px;height:26px;border-radius:2px;background:linear-gradient(115deg,#DDE4DE,#EDF1EC);flex:0 0 auto}
.mini .pz{margin-left:auto;font-family:var(--mono);font-size:11px}
.mini .tot{display:flex;justify-content:space-between;border-top:1.5px solid var(--line);margin-top:7px;padding-top:7px;font:600 12px var(--sans)}
.cmp{border-collapse:collapse;font-size:11px;background:var(--surface);border:1px solid var(--line)}
.cmp th{font:600 9.5px var(--mono);text-transform:uppercase;color:var(--muted);padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.cmp td{padding:5px 8px;border-bottom:1px solid var(--line-soft);font-family:var(--mono)}
.cmp td.hl{background:var(--pcb-soft);color:var(--pcb);font-weight:600}

/* states & anatomy */
.states{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:270px}
.states .b{font-size:11.5px;padding:7px 11px}
.st-h{background:#0A4E39}
.st-f{outline:2px solid var(--ink);outline-offset:2px}
.st-a{background:#083F2E}
.anat{position:relative;padding:14px 0}
.anat .b{position:relative}
.anat .mk{
  position:absolute;font:500 9px var(--mono);color:var(--brass);white-space:nowrap;
}
.tok{font:400 11px var(--mono);width:100%;max-width:250px}
.tok div{display:flex;gap:8px;align-items:center;padding:3.5px 0;border-bottom:1px solid var(--line-soft)}
.tok div:last-child{border-bottom:0}
.tok b{width:15px;height:15px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
.tok span{margin-left:auto;color:var(--muted)}
.target{position:relative;display:grid;place-items:center;padding:12px}
.target .hit{position:absolute;width:44px;height:44px;border:1.5px dashed var(--brass);border-radius:var(--r)}
.target .ico{width:20px;height:20px;background:var(--pcb);border-radius:3px}
.elev{display:flex;gap:9px;align-items:flex-end}
.elev div{width:44px;height:38px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);display:grid;place-items:center;font:500 9px var(--mono);color:var(--muted)}
.elev div.e1{box-shadow:0 1px 2px rgba(20,24,26,.09)}
.elev div.e2{box-shadow:0 3px 8px rgba(20,24,26,.13)}
.elev div.e3{box-shadow:0 8px 20px rgba(20,24,26,.18)}
.dens{display:flex;gap:9px}
.dens .lst{max-width:110px}
.dens .lst.cz div{padding:4px 8px;font-size:11px}

@media print{
  .masthead{position:static;border-bottom:2px solid #14181A}
  .searchrow,.cats,#copied,.tabsnav,#v-learn,#v-prog{display:none!important}
  #v-cat{display:block!important}
  .badge-state{display:none}
  body{background:#fff}
  .entry{break-inside:avoid;page-break-inside:avoid;border:1px solid #D2D7D1}
  .sample{background:#F5F7F3}
  .tip{opacity:1!important}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ================= K · SPACING DEMOS ================= */
.box-demo{display:grid;place-items:center}
.pad-out{position:relative;background:repeating-linear-gradient(45deg,#DCEBE3,#DCEBE3 4px,#EAF4EF 4px,#EAF4EF 8px);border:1px solid var(--pcb);border-radius:var(--r);padding:17px}
.pad-in{background:var(--surface);border:1px solid var(--line);padding:9px 16px;font-size:12px;border-radius:2px}
.mk-lbl{position:absolute;top:3px;left:5px;font:500 8.5px var(--mono);color:var(--pcb)}
.mar-out{position:relative;background:repeating-linear-gradient(45deg,#F6E7D5,#F6E7D5 4px,#FBF3E8 4px,#FBF3E8 8px);border:1px dashed var(--brass);border-radius:var(--r);padding:22px}
.mar-out .mk-lbl{color:var(--brass)}
.mar-in{background:var(--pcb);color:#fff;padding:9px 16px;font-size:12px;border-radius:2px}
.gap-demo{text-align:center}
.gd{display:flex;align-items:center}
.gd i{width:40px;height:34px;background:var(--pcb);border-radius:2px;display:block}
.gap-m{width:16px;height:34px;background:repeating-linear-gradient(45deg,#F6E7D5,#F6E7D5 3px,#FBF3E8 3px,#FBF3E8 6px);border-left:1px solid var(--brass);border-right:1px solid var(--brass);font:500 7px/34px var(--mono);color:var(--brass);text-align:center}
.grid-demo{display:flex;width:100%;max-width:250px;height:64px}
.gcol{flex:1;background:var(--pcb-soft);border:1px solid #C6DED4;border-radius:2px}
.ggut{width:15px;background:repeating-linear-gradient(45deg,#F6E7D5,#F6E7D5 3px,#FBF3E8 3px,#FBF3E8 6px);position:relative}

.align-demo{display:flex;flex-direction:column;gap:11px;width:100%;max-width:220px}
.ad{position:relative;padding-right:44px}
.ad i{display:block;height:8px;background:var(--pcb);opacity:.75;border-radius:2px;margin-bottom:4px}

.ad .cap{position:absolute;right:0;top:8px}
.dist{position:relative;display:flex;justify-content:space-between;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:7px;padding-bottom:17px}

.ws-demo{display:flex;gap:12px}

.ar{background:var(--pcb-soft);border:1px solid #C6DED4;border-radius:2px;display:grid;place-items:center}

.ovf{position:relative;width:104px;height:56px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:17px 7px 7px;font-size:10.5px;line-height:1.35;color:var(--muted)}

.zdemo{position:relative;width:150px;height:96px}

.resp,.adap{display:flex;flex-direction:column;gap:4px;margin-top:4px}

.adap i:nth-child(2){width:100%}

/* ================= L · TYPOGRAPHY DEMOS ================= */
.tf-row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft)}

.tf-row i{display:block;font-style:normal;font-size:12px}
.tscale{display:flex;flex-direction:column;gap:3px;line-height:1.15}

.ls-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:12px}
.kern{position:relative;padding-bottom:13px;font-size:23px;font-weight:600;letter-spacing:normal}
.kern span{display:inline-block}

.anatomy{position:relative;width:100%;max-width:215px;height:82px}
.an-lines{position:absolute;inset:0}
.an-lines i{position:absolute;left:0;right:0;border-top:1px dashed #C9A9A2;font:500 7.5px var(--mono);color:#A9736A;font-style:normal;padding-left:2px}
.an-asc{top:6px}

.baseline-al{display:flex;flex-direction:column;gap:9px;width:100%;max-width:245px}

.ba-row .ic-sq{width:13px;height:13px;background:var(--pcb);border-radius:2px;flex:0 0 auto}

.hier{width:100%;max-width:235px}
.hier b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.hier i{display:block;font-style:normal;font:500 9.5px var(--mono);color:var(--muted);letter-spacing:.05em;margin:3px 0 7px}
.hier p{margin:0 0 8px;font-size:11.5px;color:var(--muted);line-height:1.5}
.hier u{display:block;text-decoration:none;font-size:16px;font-weight:600;color:var(--pcb)}
.wid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px}
.wid p{margin:0 0 4px;font-size:11.5px;line-height:1.5}
.wid.bad span{background:var(--danger-soft);outline:1px solid #E9BDB6}
.wid i{font-style:normal}
.ta-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px}
.ta-box p{margin:2px 0 0;font-size:11.5px;line-height:1.5;max-width:165px}
.fig{display:flex;flex-direction:column;gap:2px}
.fig i{font-style:normal;font-size:12.5px;text-align:right;display:block}
.fig.prop i{font-variant-numeric:proportional-nums;font-family:var(--sans)}
.fig.tab i{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.uc-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:12.5px}

/* ================= LEARN APP ================= */
.tabsnav{display:flex;gap:4px;margin-top:11px}
.tabsnav button{
  flex:1;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:8px 4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:var(--r);cursor:pointer;
}
.tabsnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.view{display:none}
.view.on{display:block}

.startcard{
  background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:20px 18px;text-align:center;max-width:440px;margin:8px auto 0;
}
.startcard h2{font:600 19px var(--sans);margin:0 0 4px;letter-spacing:-.01em}
.startcard .sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.qstat{display:flex;gap:8px;justify-content:center;margin-bottom:17px}
.qstat div{flex:1;background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 4px}
.qstat b{display:block;font:600 20px var(--sans);line-height:1.1}
.qstat span{font:500 9px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bigbtn{
  width:100%;background:var(--pcb);color:#fff;border:0;border-radius:var(--r);
  padding:14px;font:600 15px var(--sans);cursor:pointer;
}
.bigbtn:hover{background:#0A4E39}
.bigbtn[disabled]{background:var(--line);color:var(--muted);cursor:default}
.bigbtn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:13px;padding:10px;margin-top:8px}

.sess{max-width:560px;margin:0 auto}
.sessbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sessbar .tr{flex:1;height:5px;background:#D8DED9;border-radius:9px;overflow:hidden}
.sessbar .fl{height:100%;background:var(--pcb);border-radius:9px;transition:width .25s}
.sessbar .n{font:500 11px var(--mono);color:var(--muted)}
.sessbar .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.qhead{
  display:flex;justify-content:space-between;align-items:center;gap:9px;
  padding:9px 14px;border-bottom:1px solid var(--line-soft);background:var(--well);
}
.qtype{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pcb)}
.qbox{font:500 9.5px var(--mono);color:var(--brass)}
.qstage{
  background:var(--well);
  background-image:radial-gradient(var(--line) .9px,transparent .9px);
  background-size:11px 11px;
  padding:22px 14px;display:flex;align-items:center;justify-content:center;min-height:150px;
}
.qprompt{padding:15px 14px 5px;text-align:center}
.qprompt .big{font-size:21px;font-weight:600;letter-spacing:-.01em}
.qprompt .small{font-size:12.5px;color:var(--muted);margin-top:3px}
.l-opts{padding:12px 14px 14px;display:grid;gap:7px}
.l-opts.two{grid-template-columns:1fr 1fr}
.l-opt{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;font:500 13.5px var(--sans);color:var(--ink);cursor:pointer;
}
.l-opt:hover{border-color:var(--ink)}
.l-opt.ok{background:var(--pcb-soft);border-color:var(--pcb);color:#0A4433}
.l-opt.no{background:var(--danger-soft);border-color:var(--danger);color:#842317}
.l-opt[disabled]{cursor:default}
.l-opt small{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:2px}
.l-optdemo{
  background:var(--well);border:1px solid var(--line);border-radius:var(--r);
  height:128px;overflow:hidden;position:relative;cursor:pointer;padding:6px;
}
.l-optdemo:hover{border-color:var(--ink)}
.l-optdemo .inner{
  transform:scale(.62);transform-origin:center center;
  width:161%;height:161%;margin-left:-30.5%;margin-top:-30.5%;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.l-optdemo.ok{border-color:var(--pcb);box-shadow:inset 0 0 0 2px var(--pcb)}
.l-optdemo.no{border-color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
.l-grades{padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.l-grade{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 5px;cursor:pointer;font:500 12.5px var(--sans)}
.l-grade small{display:block;font:400 9.5px var(--mono);color:var(--muted);margin-top:2px}
.l-grade.g1:hover{border-color:var(--danger);color:var(--danger)}
.l-grade.g2:hover{border-color:var(--brass);color:var(--brass)}
.l-grade.g3:hover{border-color:var(--pcb);color:var(--pcb)}
.l-reveal{padding:0 14px 13px}
.l-revealbox{background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 13px}
.l-revealbox .rn{font-size:16px;font-weight:600}
.l-revealbox .rp{font-family:var(--mono);font-size:13px;color:var(--pcb);margin-top:3px}
.l-revealbox .rd{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.l-fbk{padding:0 14px 13px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.l-fbk b{color:var(--ink)}
.l-fbk .pl-inline{font-family:var(--mono);color:var(--pcb)}
/* ===== навчальний режим v2 ===== */
.l-modes{display:grid;gap:8px;margin-top:14px}
.l-mode{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;cursor:pointer;transition:border-color .16s ease;
}
.l-mode:hover:not([disabled]){border-color:var(--pcb)}
.l-mode[disabled]{opacity:.45;cursor:default}
.l-mode .mt{flex:1;min-width:0}
.l-mode b{display:block;font:600 14.5px var(--sans)}
.l-mode small{display:block;font:400 11.5px var(--sans);color:var(--muted);margin-top:2px}
.l-mode .mn{font:600 17px var(--mono);color:var(--pcb);flex:0 0 auto}
.l-mode[disabled] .mn{color:var(--muted)}

.l-swipe{will-change:transform}
.l-prompt{padding:17px 14px 4px;text-align:center}
.l-prompt .big{font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.l-prompt .alt{font:400 12px var(--mono);color:var(--muted);margin-top:4px}

/* два способи відповіді */
.l-ways{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.l-way{
  background:var(--well);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 6px 11px;cursor:pointer;display:grid;justify-items:center;gap:5px;
  transition:border-color .16s ease,background-color .16s ease;
}
.l-way:hover{border-color:var(--pcb);background:var(--pcb-soft)}
.l-way svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.l-way span{font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* клавіатурний ввід */
.l-type{padding:14px 14px 0;display:flex;gap:8px}
.l-type input{
  flex:1;min-width:0;font:500 15px var(--mono);padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);
}
.l-type input:focus{outline:2px solid var(--pcb);outline-offset:1px;border-color:var(--pcb)}
.l-type input.ok{background:var(--pcb-soft);border-color:var(--pcb);color:#0A4433}
.l-type input.no{background:var(--danger-soft);border-color:var(--danger);color:#842317}
.l-check{
  flex:0 0 auto;width:44px;border:1px solid var(--pcb);background:var(--pcb);color:#fff;
  border-radius:var(--r);cursor:pointer;font-size:16px;line-height:1;
}
.l-typemeta{
  padding:8px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  font:400 11.5px var(--mono);color:var(--muted);
}
.l-hintbtn{background:none;border:0;padding:0;cursor:pointer;font:500 11.5px var(--mono);color:var(--pcb);text-decoration:underline}
.l-hintbtn[disabled]{color:var(--muted);text-decoration:none;cursor:default}

/* дві дії внизу картки — вони ж індикатор свайпу */
.l-act{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;
  border-top:1px solid var(--line-soft);margin-top:14px}
.l-act .sep{width:1px;background:var(--line-soft)}
.l-act button{
  background:none;border:0;padding:13px 10px;cursor:pointer;
  font:500 12.5px var(--sans);color:var(--muted);line-height:1.3;
  transition:background-color .14s ease,color .14s ease;
}
.l-act .lft:hover,.l-act .lft.arm{background:var(--pcb);color:#fff}
.l-act .rgt:hover,.l-act .rgt.arm{background:var(--danger);color:#fff}

.l-revhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.l-revhead .pl{margin:0}
.l-revhead .l-lang{margin-top:2px}
.l-hint3{padding:0 14px 14px;font:400 12px var(--sans);color:var(--muted);text-align:center}
.l-done{text-align:center;padding:32px 18px}
.l-done .big{font:600 26px var(--sans);margin-bottom:5px}
.l-done p{color:var(--muted);font-size:13.5px;margin:0 0 17px}

/* progress view */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.pcell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 8px;text-align:center}
.pcell b{display:block;font:600 22px var(--sans);line-height:1.1}
.pcell span{font:500 8.5px var(--mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.pcell.s0 b{color:var(--muted)}
.pcell.s1 b{color:var(--brass)}
.pcell.s2 b{color:#3E7F5E}
.pcell.s3 b{color:var(--pcb)}
.catrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.catrow .nm{font-size:12.5px;flex:0 0 130px}
.catrow .tr{flex:1;height:7px;background:#DDE3DE;border-radius:9px;overflow:hidden;display:flex}
.catrow .f3{background:var(--pcb);height:100%}
.catrow .f2{background:#69A98D;height:100%}
.catrow .f1{background:var(--brass);height:100%;opacity:.55}
.catrow .pc{font:500 11px var(--mono);color:var(--muted);flex:0 0 38px;text-align:right}
.weak{margin-top:20px}
.weak h3,.pgsec{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:0 0 9px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}

.tools button{font:500 11.5px var(--sans);padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;color:var(--ink)}

.hint2{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5}
.badge-state{font:500 8.5px var(--mono);padding:2px 5px;border-radius:2px;letter-spacing:.04em}
.bs0{background:var(--line-soft);color:var(--muted)}
.bs1{background:var(--brass-soft);color:var(--brass)}
.bs2{background:#DCEBE3;color:#3E7F5E}
.bs3{background:var(--pcb);color:#fff}
@media(max-width:520px){
  .l-opts.two{grid-template-columns:1fr 1fr}
  .l-optdemo{height:112px}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .catrow .nm{flex:0 0 96px;font-size:11.5px}
}
